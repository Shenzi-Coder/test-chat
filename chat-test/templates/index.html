<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>آنیل و الشن — پیام‌رسان شخصی</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════
   RESET & TOKENS
   ═══════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-0: #05060c;
  --bg-1: #0a0d17;
  --bg-2: #111522;
  --bg-3: #181d2e;
  --bg-4: #232941;
  --border: #2a3148;
  --border-soft: rgba(255, 255, 255, 0.055);

  --text: #f0f3ff;
  --text-dim: #a3abc6;
  --text-mute: #6a7392;

  --accent: #8b5cf6;
  --accent-2: #a78bfa;
  --accent-3: #ec4899;
  --accent-4: #f43f5e;
  --cyan: #22d3ee;
  --green: #10b981;
  --green-glow: rgba(16, 185, 129, 0.55);
  --red: #ef4444;

  --grad-me: linear-gradient(135deg, #8b5cf6 0%, #a855f7 40%, #ec4899 100%);
  --grad-anil: linear-gradient(135deg, #ec4899, #f43f5e);
  --grad-elshan: linear-gradient(135deg, #8b5cf6, #6366f1);
  --grad-brand: linear-gradient(120deg, #a78bfa, #ec4899, #22d3ee);

  --radius: 20px;
  --radius-lg: 28px;
  --radius-sm: 14px;
  --radius-xl: 36px;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 26px rgba(0, 0, 0, 0.42);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
  --glow: 0 0 32px rgba(139, 92, 246, 0.45);

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --expo: cubic-bezier(0.16, 1, 0.3, 1);
}

html, body {
  height: 100%;
  font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-0);
  color: var(--text);
  direction: rtl;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

::selection { background: rgba(139, 92, 246, 0.4); color: #fff; }

/* ═══════════════════════════════════════════════════════════════════
   BACKGROUND
   ═══════════════════════════════════════════════════════════════════ */
.bg-stage {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(139, 92, 246, 0.22), transparent 60%),
    radial-gradient(800px 450px at 10% 110%, rgba(236, 72, 153, 0.16), transparent 60%),
    radial-gradient(700px 400px at 50% 50%, rgba(34, 211, 238, 0.05), transparent 60%);
}

.bg-stage::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.7;
}

/* ═══════════════════════════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════════════════════════ */
.app {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 880px;
  margin: 0 auto;
  background: linear-gradient(180deg, rgba(10, 13, 23, 0.92), rgba(5, 6, 12, 0.98));
  border-left: 1px solid var(--border-soft);
  border-right: 1px solid var(--border-soft);
  overflow: hidden;
  box-shadow: 0 0 100px rgba(139, 92, 246, 0.08);
}

/* ═══════════════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════════════ */
.header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  background: linear-gradient(180deg, rgba(17, 21, 34, 0.98), rgba(10, 13, 23, 0.85));
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
  z-index: 20;
}

.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent-3), var(--cyan), transparent);
  background-size: 200% 100%;
  animation: shimmerLine 4s linear infinite;
  opacity: 0.75;
}

@keyframes shimmerLine {
  0%   { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

.avatars-stack {
  position: relative;
  width: 56px;
  height: 56px;
  flex-shrink: 0;
}

.avatar-ring {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--accent), var(--accent-3), var(--cyan), var(--accent));
  animation: spinSlow 6s linear infinite;
  opacity: 0.85;
}

@keyframes spinSlow { to { transform: rotate(360deg); } }

.avatar-ring-inner {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--bg-1);
}

.avatar-mini {
  position: absolute;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
  color: #fff;
  border: 2px solid var(--bg-1);
  box-shadow: var(--shadow-sm);
  transition: transform 0.35s var(--spring), z-index 0s;
  cursor: default;
  overflow: hidden;
}

.avatar-mini img { width: 100%; height: 100%; object-fit: cover; }

.avatar-mini.anil { background: var(--grad-anil); top: 0; right: 0; z-index: 3; }
.avatar-mini.elshan { background: var(--grad-elshan); bottom: 0; left: 0; z-index: 2; }

.avatars-stack:hover .avatar-mini { transform: scale(1.12) rotate(-6deg); z-index: 10; }

.header-info { flex: 1; min-width: 0; }

.header-title {
  font-size: 16.5px;
  font-weight: 800;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 6px;
  line-height: 1.2;
}

.header-title .grad-text {
  background: var(--grad-brand);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientShift 5s ease infinite;
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

.heart-beat {
  font-size: 13px;
  -webkit-text-fill-color: initial;
  animation: heartbeat 1.6s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  25%      { transform: scale(1.25); }
  40%      { transform: scale(0.95); }
  60%      { transform: scale(1.2); }
}

.header-status {
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 4px;
  min-height: 16px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 0 var(--green-glow);
  animation: pulseGreen 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulseGreen {
  0%   { box-shadow: 0 0 0 0 var(--green-glow); }
  70%  { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.status-dot.offline { background: var(--text-mute); animation: none; box-shadow: none; }

.header-actions { display: flex; gap: 8px; }

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--bg-2);
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.25s var(--ease);
  position: relative;
  overflow: hidden;
  text-decoration: none;
}

.icon-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--grad-me);
  opacity: 0;
  transition: opacity 0.25s;
}

.icon-btn > span { position: relative; z-index: 1; }

.icon-btn:hover {
  color: #fff;
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--glow);
}

.icon-btn:hover::before { opacity: 0.18; }
.icon-btn:active { transform: scale(0.94); }

.icon-btn.call-btn { color: var(--green); border-color: rgba(16, 185, 129, 0.35); }
.icon-btn.call-btn:hover {
  color: #fff;
  border-color: var(--green);
  box-shadow: 0 0 26px rgba(16, 185, 129, 0.55);
}
.icon-btn.call-btn:hover::before { background: linear-gradient(135deg, #10b981, #22d3ee); opacity: 0.25; }

.icon-btn.video-btn { color: var(--cyan); border-color: rgba(34, 211, 238, 0.35); }
.icon-btn.video-btn:hover {
  color: #fff;
  border-color: var(--cyan);
  box-shadow: 0 0 26px rgba(34, 211, 238, 0.55);
}
.icon-btn.video-btn:hover::before { background: linear-gradient(135deg, #22d3ee, #8b5cf6); opacity: 0.25; }

.icon-btn.call-btn.ringing,
.icon-btn.video-btn.ringing {
  animation: ringingPulse 1.2s ease-in-out infinite;
}

@keyframes ringingPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
  50%      { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
}

/* ═══════════════════════════════════════════════════════════════════
   MESSAGES AREA
   ═══════════════════════════════════════════════════════════════════ */
.messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 26px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  position: relative;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-4) transparent;
  -webkit-overflow-scrolling: touch;
}

.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 20px; }
.messages::-webkit-scrollbar-thumb:hover { background: var(--accent); }

.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-mute);
  font-size: 14px;
  line-height: 2;
  padding: 40px 20px;
}

.empty-orb {
  width: 110px;
  height: 110px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(167, 139, 250, 0.5), rgba(236, 72, 153, 0.3) 60%, transparent 80%);
  display: grid;
  place-items: center;
  font-size: 52px;
  animation: floatOrb 4s ease-in-out infinite;
  box-shadow: 0 0 60px rgba(139, 92, 246, 0.35), inset 0 0 40px rgba(167, 139, 250, 0.15);
}

@keyframes floatOrb {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-14px) rotate(6deg); }
}

.empty-state .title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.date-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 20px 8px 14px;
  color: var(--text-mute);
  font-size: 11px;
  font-weight: 600;
}

.date-divider::before,
.date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-soft), transparent);
}

.date-divider span {
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(24, 29, 46, 0.6);
  border: 1px solid var(--border-soft);
}

.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 4px;
  position: relative;
  animation: msgIn 0.4s var(--spring);
  transform-origin: bottom;
}

.msg-row.mine { flex-direction: row-reverse; }

@keyframes msgIn {
  0%   { opacity: 0; transform: translateY(14px) scale(0.9); }
  70%  { opacity: 1; transform: translateY(-2px) scale(1.01); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 12.5px;
  color: #fff;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  align-self: flex-end;
  margin-bottom: 22px;
  overflow: hidden;
}

.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

.msg-avatar.anil { background: var(--grad-anil); box-shadow: 0 4px 14px rgba(236, 72, 153, 0.4); }
.msg-avatar.elshan { background: var(--grad-elshan); box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4); }
.msg-avatar.system { background: linear-gradient(135deg, #64748b, #475569); }

.msg-bubble-wrap {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-width: min(78%, 480px);
  min-width: 0;
}

.msg-row.mine .msg-bubble-wrap { align-items: flex-start; }

.msg-sender {
  font-size: 11px;
  font-weight: 700;
  padding: 0 10px;
  margin-bottom: 1px;
}

.msg-row:not(.mine) .msg-sender.anil { color: #f472b6; }
.msg-row:not(.mine) .msg-sender.elshan { color: var(--accent-2); }
.msg-row:not(.mine) .msg-sender.other { color: var(--cyan); }
.msg-row.mine .msg-sender { display: none; }

.msg-bubble {
  padding: 11px 15px;
  border-radius: 20px;
  font-size: 14.5px;
  line-height: 1.65;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  position: relative;
  box-shadow: var(--shadow-sm);
  isolation: isolate;
}

.msg-row:not(.mine) .msg-bubble {
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border: 1px solid var(--border-soft);
  border-bottom-right-radius: 6px;
  color: var(--text);
}

.msg-row.mine .msg-bubble {
  background: var(--grad-me);
  color: #fff;
  border-bottom-left-radius: 6px;
  box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.msg-row.mine .msg-bubble::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 45%);
  pointer-events: none;
  z-index: -1;
}

.msg-bubble img,
.msg-bubble video {
  display: block;
  max-width: 100%;
  border-radius: 14px;
  cursor: zoom-in;
}

.msg-bubble audio {
  display: block;
  width: 260px;
  max-width: 100%;
  border-radius: 14px;
  outline: none;
}

.msg-bubble .file-caption {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  opacity: 0.85;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
  font-weight: 500;
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: var(--text-mute);
  padding: 0 10px;
  margin-top: 1px;
}

.msg-row.mine .msg-meta { flex-direction: row-reverse; justify-content: flex-start; }

.msg-time { font-variant-numeric: tabular-nums; letter-spacing: 0.4px; font-weight: 500; }

.msg-tick {
  font-size: 12px;
  color: var(--text-mute);
  transition: color 0.35s var(--ease);
  display: inline-flex;
  align-items: center;
  font-weight: 700;
  letter-spacing: -1px;
}

.msg-tick.read { color: var(--cyan); text-shadow: 0 0 10px rgba(34, 211, 238, 0.6); }

.msg-row.system { justify-content: center; margin: 10px 0; }
.msg-row.system .msg-avatar { display: none; }
.msg-row.system .msg-bubble-wrap { max-width: 88%; align-items: center; }

.msg-row.system .msg-bubble {
  background: rgba(24, 29, 46, 0.55);
  border: 1px solid var(--border-soft);
  color: var(--text-mute);
  font-size: 11.5px;
  padding: 7px 16px;
  border-radius: 999px;
  box-shadow: none;
  font-weight: 500;
}

.msg-row.system .msg-bubble::before { display: none; }
.msg-row.system .msg-meta { display: none; }

/* ═══════════════════════════════════════════════════════════════════
   TYPING
   ═══════════════════════════════════════════════════════════════════ */
.typing-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 22px;
  font-size: 12px;
  color: var(--text-dim);
  min-height: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s var(--expo), padding 0.35s var(--expo);
}

.typing-bar.visible { max-height: 44px; padding: 6px 22px 8px; }

.typing-bubble {
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-3);
  padding: 9px 14px;
  border-radius: 18px;
  border: 1px solid var(--border-soft);
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-2);
  animation: typingBounce 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.18s; background: var(--accent-3); }
.typing-dot:nth-child(3) { animation-delay: 0.36s; background: var(--cyan); }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
  30%           { transform: translateY(-6px); opacity: 1; }
}

#typing-text { font-weight: 500; font-size: 11.5px; }

/* ═══════════════════════════════════════════════════════════════════
   INPUT BAR
   ═══════════════════════════════════════════════════════════════════ */
.input-bar {
  padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(0deg, rgba(5, 6, 12, 0.98), rgba(10, 13, 23, 0.85));
  border-top: 1px solid var(--border-soft);
  flex-shrink: 0;
  position: relative;
}

.input-bar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent-3), transparent);
  opacity: 0.5;
}

.input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: 5px 6px 5px 8px;
  transition: all 0.25s var(--ease);
}

.input-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18), 0 0 30px rgba(139, 92, 246, 0.15);
  background: var(--bg-3);
}

.input-action {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 19px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.22s var(--spring);
  flex-shrink: 0;
}

.input-action:hover {
  background: var(--bg-4);
  color: var(--accent-2);
  transform: scale(1.1) rotate(8deg);
}

.input-action:active { transform: scale(0.9); }

#chat-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 14.5px;
  padding: 11px 4px;
  outline: none;
  resize: none;
  max-height: 130px;
  min-height: 22px;
  line-height: 1.55;
  scrollbar-width: none;
}

#chat-input::-webkit-scrollbar { display: none; }
#chat-input::placeholder { color: var(--text-mute); }

.send-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: none;
  background: var(--grad-me);
  color: #fff;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.3s var(--spring);
  flex-shrink: 0;
  box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.send-btn:not(:disabled):hover {
  transform: scale(1.1) rotate(-8deg);
  box-shadow: 0 8px 28px rgba(139, 92, 246, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

.send-btn:not(:disabled):active { transform: scale(0.92); }

.send-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  background: var(--bg-4);
  box-shadow: none;
}

.send-btn svg {
  width: 20px;
  height: 20px;
  transform: scaleX(-1);
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
}

/* ═══════════════════════════════════════════════════════════════════
   FILE PREVIEW
   ═══════════════════════════════════════════════════════════════════ */
.file-preview {
  display: none;
  margin-bottom: 8px;
  padding: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  align-items: center;
  gap: 12px;
}

.file-preview.visible { display: flex; }

.file-preview-thumb {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  object-fit: cover;
  background: var(--bg-4);
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 26px;
  overflow: hidden;
}

.file-preview-info { flex: 1; min-width: 0; font-size: 12px; }

.file-preview-name {
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}

.file-preview-size { color: var(--text-mute); font-size: 11px; }

.file-preview-remove {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--bg-4);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  display: grid;
  place-items: center;
  transition: all 0.25s var(--spring);
  flex-shrink: 0;
}

.file-preview-remove:hover {
  background: var(--red);
  color: #fff;
  transform: rotate(90deg) scale(1.08);
}

/* ═══════════════════════════════════════════════════════════════════
   RECORDING BAR
   ═══════════════════════════════════════════════════════════════════ */
.recording-bar {
  display: none;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  padding: 10px 14px;
  background: var(--bg-2);
  border: 1px solid var(--red);
  border-radius: 16px;
}

.recording-bar.visible { display: flex; }

.rec-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--red);
  animation: recPulse 1s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes recPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.8); }
}

.rec-time {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--red);
  font-size: 13px;
  min-width: 48px;
}

.rec-hint {
  flex: 1;
  font-size: 11.5px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rec-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  font-size: 15px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.2s var(--spring);
  flex-shrink: 0;
}

.rec-btn.stop   { background: var(--green); color: #fff; }
.rec-btn.cancel { background: var(--bg-4); color: var(--text-dim); }
.rec-btn:hover  { transform: scale(1.1); }
.rec-btn.cancel:hover { background: var(--red); color: #fff; }

/* ═══════════════════════════════════════════════════════════════════
   SCROLL TO BOTTOM
   ═══════════════════════════════════════════════════════════════════ */
.scroll-btn {
  position: absolute;
  bottom: 96px;
  left: 22px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-3);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px) scale(0.85);
  transition: all 0.35s var(--spring);
  z-index: 30;
}

.scroll-btn.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.scroll-btn:hover {
  background: var(--accent);
  color: #fff;
  box-shadow: var(--glow);
}

/* ═══════════════════════════════════════════════════════════════════
   NAME MODAL
   ═══════════════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 6, 12, 0.88);
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s var(--expo);
}

.modal-overlay.visible { opacity: 1; pointer-events: auto; }

.modal {
  background: linear-gradient(180deg, rgba(24, 29, 46, 0.98), rgba(10, 13, 23, 0.98));
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 40px 30px 32px;
  max-width: 430px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-lg), 0 0 80px rgba(139, 92, 246, 0.3);
  transform: scale(0.88) translateY(24px);
  transition: transform 0.5s var(--spring);
}

.modal-overlay.visible .modal { transform: scale(1) translateY(0); }

.modal-icon {
  width: 84px;
  height: 84px;
  margin: 0 auto 22px;
  border-radius: 24px;
  display: grid;
  place-items: center;
  font-size: 42px;
  background: var(--grad-me);
  box-shadow: 0 12px 40px rgba(139, 92, 246, 0.55), inset 0 2px 0 rgba(255, 255, 255, 0.25);
  animation: floatOrb 3.5s ease-in-out infinite;
}

.modal-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 8px;
  background: var(--grad-brand);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientShift 4s ease infinite;
}

.modal-subtitle {
  color: var(--text-dim);
  font-size: 13.5px;
  margin-bottom: 28px;
  line-height: 1.75;
}

.name-options { display: flex; gap: 12px; margin-bottom: 22px; }

.name-btn {
  flex: 1;
  padding: 20px 12px;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  background: var(--bg-3);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s var(--spring);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.name-btn:hover { transform: translateY(-4px); }
.name-btn.anil:hover { border-color: var(--accent-3); box-shadow: 0 12px 32px rgba(236, 72, 153, 0.4); }
.name-btn.elshan:hover { border-color: var(--accent); box-shadow: 0 12px 32px rgba(139, 92, 246, 0.45); }

.name-emoji { font-size: 32px; }

.divider-text {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-mute);
  font-size: 11.5px;
  margin: 18px 0;
  font-weight: 500;
}

.divider-text::before,
.divider-text::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}

.custom-name-wrap { display: flex; gap: 8px; }

#custom-name {
  flex: 1;
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  text-align: center;
}

#custom-name:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
  background: var(--bg-4);
}

.confirm-btn {
  background: var(--grad-me);
  color: #fff;
  border: none;
  padding: 14px 22px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s var(--spring);
  white-space: nowrap;
  box-shadow: 0 6px 18px rgba(139, 92, 246, 0.4);
}

.confirm-btn:hover { transform: translateY(-2px) scale(1.02); }

/* ═══════════════════════════════════════════════════════════════════
   CALL MODAL (incoming / outgoing)
   ═══════════════════════════════════════════════════════════════════ */
.call-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 6, 12, 0.93);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 2500;
  display: none;
  place-items: center;
  padding: 24px;
  animation: fadeIn 0.35s var(--expo);
}

.call-overlay.visible { display: grid; }

.call-card {
  background: linear-gradient(180deg, rgba(24, 29, 46, 0.98), rgba(10, 13, 23, 0.98));
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 40px 30px 32px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-lg), 0 0 100px rgba(139, 92, 246, 0.35);
  position: relative;
  overflow: hidden;
  animation: callCardIn 0.5s var(--spring);
}

@keyframes callCardIn {
  from { opacity: 0; transform: scale(0.85) translateY(30px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.call-card::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(139, 92, 246, 0.2), transparent, rgba(34, 211, 238, 0.15), transparent);
  animation: spinSlow 8s linear infinite;
  opacity: 0.55;
  z-index: 0;
  pointer-events: none;
}

.call-card::after {
  content: '';
  position: absolute;
  inset: 1px;
  border-radius: calc(var(--radius-xl) - 1px);
  background: linear-gradient(180deg, rgba(24, 29, 46, 0.97), rgba(10, 13, 23, 0.99));
  z-index: 0;
}

.call-card > * { position: relative; z-index: 1; }

.call-avatar-wrap {
  position: relative;
  width: 132px;
  height: 132px;
  margin: 0 auto 24px;
}

.call-avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  background: var(--grad-me);
  display: grid;
  place-items: center;
  font-size: 44px;
  font-weight: 800;
  color: #fff;
  border: 3px solid rgba(139, 92, 246, 0.7);
  box-shadow: 0 0 40px rgba(139, 92, 246, 0.55);
  position: relative;
  z-index: 2;
}

.call-avatar img { width: 100%; height: 100%; object-fit: cover; }

.call-ring-wave {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(139, 92, 246, 0.6);
  animation: callWave 2s ease-out infinite;
  z-index: 1;
}

.call-ring-wave:nth-child(2) { animation-delay: 0.6s; }
.call-ring-wave:nth-child(3) { animation-delay: 1.2s; }

@keyframes callWave {
  0%   { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(1.9); opacity: 0; }
}

.call-name {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.4px;
}

.call-status {
  font-size: 13.5px;
  color: var(--text-dim);
  margin-bottom: 32px;
  min-height: 20px;
  font-weight: 500;
}

.call-status .pulse-dots::after {
  content: '';
  animation: dots 1.4s steps(4, end) infinite;
}

@keyframes dots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

.call-mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(34, 211, 238, 0.12);
  border: 1px solid rgba(34, 211, 238, 0.3);
  color: var(--cyan);
  font-weight: 600;
  margin-bottom: 24px;
}

.call-mode-badge.audio {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(16, 185, 129, 0.3);
  color: var(--green);
}

.call-actions {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}

.call-action-btn {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 26px;
  transition: all 0.25s var(--spring);
  color: #fff;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}

.call-action-btn:hover { transform: scale(1.08); }
.call-action-btn:active { transform: scale(0.94); }

.call-action-btn.accept {
  background: linear-gradient(135deg, #10b981, #22d3ee);
  box-shadow: 0 8px 28px rgba(16, 185, 129, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  animation: acceptPulse 1.6s ease-in-out infinite;
}

@keyframes acceptPulse {
  0%, 100% { box-shadow: 0 8px 28px rgba(16, 185, 129, 0.55), 0 0 0 0 rgba(16, 185, 129, 0.5); }
  50%      { box-shadow: 0 8px 28px rgba(16, 185, 129, 0.55), 0 0 0 14px rgba(16, 185, 129, 0); }
}

.call-action-btn.reject {
  background: linear-gradient(135deg, #ef4444, #ec4899);
  box-shadow: 0 8px 28px rgba(239, 68, 68, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

.call-action-btn small {
  display: block;
  font-size: 10px;
  margin-top: 2px;
  font-family: 'Vazirmatn', sans-serif;
}

/* ═══════════════════════════════════════════════════════════════════
   ACTIVE CALL OVERLAY — Audio + Video
   ═══════════════════════════════════════════════════════════════════ */
.call-active-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(900px 500px at 50% 0%, rgba(139, 92, 246, 0.3), transparent 70%),
              linear-gradient(180deg, #0a0d17, #05060c);
  z-index: 2400;
  display: none;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
  animation: fadeIn 0.4s var(--expo);
}

.call-active-overlay.visible { display: flex; }

/* ── Header ── */
.call-active-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 4px;
  flex-shrink: 0;
  z-index: 2;
}

.call-active-info {
  text-align: right;
}

.call-active-title {
  font-size: 12.5px;
  color: var(--text-dim);
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.call-active-title .mode-icon {
  font-size: 13px;
}

.call-active-name {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.3px;
}

.call-active-timer {
  font-size: 13px;
  color: var(--text-mute);
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
  margin-top: 2px;
}

/* ── Video stage ── */
.call-stage {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  overflow: hidden;
  border-radius: 24px;
  margin: 12px 0;
}

/* ویدیوی طرف مقابل (بزرگ) */
.remote-video-wrap {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

.remote-video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

/* وقتی طرف مقابل دوربین نداره یا ویدیو خاموشه */
.remote-video-wrap.video-off video { display: none; }

.remote-placeholder {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: radial-gradient(circle at center, rgba(139, 92, 246, 0.2), transparent 70%),
              linear-gradient(180deg, #0a0d17, #05060c);
  border-radius: 24px;
  z-index: 2;
}

.remote-video-wrap.video-off .remote-placeholder { display: flex; }

.remote-placeholder-avatar {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--grad-me);
  display: grid;
  place-items: center;
  font-size: 64px;
  font-weight: 800;
  color: #fff;
  border: 4px solid rgba(139, 92, 246, 0.7);
  box-shadow: 0 0 60px rgba(139, 92, 246, 0.55);
  position: relative;
}

.remote-placeholder-avatar img { width: 100%; height: 100%; object-fit: cover; }

.remote-placeholder-avatar::before,
.remote-placeholder-avatar::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(139, 92, 246, 0.4);
  animation: activePulse 2.4s ease-out infinite;
}

.remote-placeholder-avatar::after { animation-delay: 1.2s; }

@keyframes activePulse {
  0%   { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.35); opacity: 0; }
}

.remote-placeholder-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

.remote-placeholder-hint {
  font-size: 12px;
  color: var(--text-mute);
}

/* ویدیوی خودم (کوچیک، گوشه) */
.local-video-wrap {
  position: absolute;
  bottom: 16px;
  left: 16px;
  width: 130px;
  height: 174px;
  border-radius: 16px;
  overflow: hidden;
  background: #000;
  border: 2px solid rgba(139, 92, 246, 0.6);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  z-index: 3;
  transition: transform 0.3s var(--spring), opacity 0.3s;
  cursor: pointer;
}

.local-video-wrap:hover {
  transform: scale(1.04);
}

.local-video-wrap video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1); /* آینه برای خودم */
  background: #000;
}

.local-video-wrap.video-off {
  background: linear-gradient(135deg, #1a1025, #0a0d17);
  display: grid;
  place-items: center;
}

.local-video-wrap.video-off video { display: none; }

.local-video-off-icon {
  display: none;
  font-size: 28px;
  color: var(--text-mute);
  text-align: center;
}

.local-video-wrap.video-off .local-video-off-icon { display: block; }

.local-video-label {
  position: absolute;
  bottom: 4px;
  right: 6px;
  font-size: 9.5px;
  color: rgba(255, 255, 255, 0.75);
  background: rgba(0, 0, 0, 0.5);
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 600;
}

/* حالت تمام‌صفحه (بدون دوربین خودم) */
.call-active-overlay.fullscreen-local .local-video-wrap {
  width: 50%;
  height: auto;
  aspect-ratio: 3 / 4;
  bottom: 50%;
  left: 50%;
  transform: translate(-50%, 50%);
  max-height: 70vh;
  max-width: 70vh;
}

/* ── Controls ── */
.call-active-actions {
  display: flex;
  gap: 14px;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 12px 0 4px;
  z-index: 2;
}

.call-active-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 24px;
  transition: all 0.25s var(--spring);
  background: rgba(24, 29, 46, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  position: relative;
}

.call-active-btn:hover { transform: scale(1.08); background: var(--bg-4); }
.call-active-btn:active { transform: scale(0.94); }

.call-active-btn.mute.active {
  background: linear-gradient(135deg, #ef4444, #f43f5e);
  color: #fff;
  border-color: transparent;
}

.call-active-btn.video-toggle.active {
  background: linear-gradient(135deg, #ef4444, #f43f5e);
  color: #fff;
  border-color: transparent;
}

.call-active-btn.end {
  width: 72px;
  height: 72px;
  background: linear-gradient(135deg, #ef4444, #ec4899);
  color: #fff;
  border: none;
  box-shadow: 0 10px 30px rgba(239, 68, 68, 0.6);
}

.call-active-btn.end:hover {
  background: linear-gradient(135deg, #dc2626, #db2777);
  box-shadow: 0 12px 36px rgba(239, 68, 68, 0.8);
}

.call-active-btn small {
  display: block;
  font-size: 9px;
  margin-top: 1px;
  font-family: 'Vazirmatn', sans-serif;
  font-weight: 500;
}

/* عناصر صوتی مخفی */
#remote-audio { display: none; }

/* ═══════════════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: rgba(24, 29, 46, 0.98);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 13px 24px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  z-index: 5000;
  transition: transform 0.45s var(--spring), opacity 0.3s;
  max-width: 90vw;
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { border-color: var(--green); box-shadow: 0 8px 30px rgba(16, 185, 129, 0.35); }
.toast.error { border-color: var(--red); box-shadow: 0 8px 30px rgba(239, 68, 68, 0.35); }

/* ═══════════════════════════════════════════════════════════════════
   LIGHTBOX
   ═══════════════════════════════════════════════════════════════════ */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.95);
  z-index: 3000;
  display: none;
  place-items: center;
  padding: 40px;
  cursor: zoom-out;
}

.lightbox.visible { display: grid; }

.lightbox img,
.lightbox video {
  max-width: 100%;
  max-height: 100%;
  border-radius: 14px;
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.85);
}

.lightbox-close {
  position: absolute;
  top: 24px;
  left: 24px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-3);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.25s var(--spring);
}

.lightbox-close:hover { background: var(--red); color: #fff; transform: rotate(90deg); }

/* ═══════════════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════════════ */
@media (max-width: 680px) {
  .app { border-left: none; border-right: none; }
  .header { padding: 12px 16px; gap: 10px; }

  .name-options { flex-direction: column; }

  .scroll-btn { left: 14px; bottom: 90px; width: 42px; height: 42px; }

</head>
<body>

<!-- ═══════════════ BACKGROUND ═══════════════ -->

<!-- ═══════════════ APP ═══════════════ -->
<div class="app">

  <!-- ── Header ── -->

    <div class="header-actions">

<!-- ═══════════════ NAME MODAL ═══════════════ -->
<div class="modal-overlay visible" id="name-modal">
  <div class="modal">
    <div class="modal-icon">💜</div>

<!-- ═══════════════ LIGHTBOX ═══════════════ -->
