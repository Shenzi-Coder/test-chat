<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0f1a" />
<title>آنیل و الشن — پیام‌رسان شخصی</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ═════════════════════════════════════════════
   RESET & VARIABLES
   ═════════════════════════════════════════════ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-0: #07080f;
  --bg-1: #0d1019;
  --bg-2: #141826;
  --bg-3: #1c2133;
  --bg-4: #262c42;
  --border: #2a3148;
  --border-soft: rgba(255, 255, 255, 0.06);

  --text: #eef1fb;
  --text-dim: #a2aac4;
  --text-mute: #6d7694;

  --accent: #8b5cf6;
  --accent-2: #a78bfa;
  --accent-3: #ec4899;
  --accent-glow: rgba(139, 92, 246, 0.4);

  --cyan: #22d3ee;
  --green: #10b981;
  --green-glow: rgba(16, 185, 129, 0.5);
  --red: #ef4444;
  --amber: #f59e0b;

  --bubble-me: linear-gradient(135deg, #8b5cf6 0%, #a855f7 50%, #ec4899 100%);
  --bubble-other: #1c2133;

  --radius: 20px;
  --radius-lg: 28px;
  --radius-sm: 14px;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 30px var(--accent-glow);

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

html, body {
  height: 100%;
  font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-0);
  color: var(--text);
  direction: rtl;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(1200px 600px at 90% -10%, rgba(139, 92, 246, 0.18), transparent 60%),
    radial-gradient(1000px 500px at -10% 110%, rgba(236, 72, 153, 0.12), transparent 60%),
    radial-gradient(800px 400px at 50% 50%, rgba(34, 211, 238, 0.05), transparent 60%);
  pointer-events: none;
  z-index: 0;
  animation: auroraShift 20s ease-in-out infinite;
}

@keyframes auroraShift {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.7; transform: scale(1.05); }
}

/* ═════════════════════════════════════════════
   APP LAYOUT
   ═════════════════════════════════════════════ */
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  background: linear-gradient(180deg, rgba(13, 16, 25, 0.85), rgba(7, 8, 15, 0.95));
  backdrop-filter: blur(20px);
  border-left: 1px solid var(--border-soft);
  border-right: 1px solid var(--border-soft);
  overflow: hidden;
}

/* ═════════════════════════════════════════════
   HEADER
   ═════════════════════════════════════════════ */
.header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  background: linear-gradient(180deg, rgba(20, 24, 38, 0.95), rgba(13, 16, 25, 0.85));
  border-bottom: 1px solid var(--border-soft);
  position: relative;
  z-index: 10;
  backdrop-filter: blur(24px);
  flex-shrink: 0;
}

.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent-3), transparent);
  opacity: 0.6;
}

.avatars-stack {
  position: relative;
  width: 52px;
  height: 52px;
  flex-shrink: 0;
}

.avatar-mini {
  position: absolute;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
  color: #fff;
  border: 2px solid var(--bg-1);
  box-shadow: var(--shadow-sm);
  transition: transform 0.3s var(--spring);
}

.avatar-mini.anil {
  background: linear-gradient(135deg, #ec4899, #f43f5e);
  top: 0; right: 0;
  z-index: 2;
}

.avatar-mini.elshan {
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  bottom: 0; left: 0;
  z-index: 1;
}

.avatar-mini:hover { transform: scale(1.1) rotate(-5deg); z-index: 10; }

.header-info {
  flex: 1;
  min-width: 0;
}

.header-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.3px;
  background: linear-gradient(90deg, #fff, var(--accent-2), var(--accent-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: flex;
  align-items: center;
  gap: 6px;
}

.header-title::after {
  content: '💜';
  font-size: 13px;
  -webkit-text-fill-color: initial;
  color: initial;
  animation: heartbeat 1.8s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.2); }
}

.header-status {
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
  min-height: 16px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 0 var(--green-glow);
  animation: pulseGreen 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulseGreen {
  0%   { box-shadow: 0 0 0 0 var(--green-glow); }
  70%  { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.status-dot.offline {
  background: var(--text-mute);
  animation: none;
}

.header-actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-2);
  color: var(--text-dim);
  font-size: 17px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.2s var(--ease);
  position: relative;
  overflow: hidden;
}

.icon-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-3));
  opacity: 0;
  transition: opacity 0.2s;
}

.icon-btn:hover {
  color: #fff;
  border-color: var(--accent);
  transform: translateY(-1px);
}

.icon-btn:hover::before { opacity: 0.15; }
.icon-btn:active { transform: scale(0.96); }
.icon-btn span { position: relative; z-index: 1; }

/* ═════════════════════════════════════════════
   MESSAGES AREA
   ═════════════════════════════════════════════ */
.messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-4) transparent;
}

.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb {
  background: var(--bg-4);
  border-radius: 20px;
}
.messages::-webkit-scrollbar-thumb:hover { background: var(--border); }

/* ── Empty state ── */
.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-mute);
  font-size: 14px;
  line-height: 2;
  padding: 40px 20px;
  animation: fadeIn 0.6s var(--ease);
}

.empty-state .emoji {
  font-size: 64px;
  display: block;
  margin-bottom: 16px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-10px) rotate(5deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Date divider ── */
.date-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0 12px;
  color: var(--text-mute);
  font-size: 11px;
  font-weight: 600;
}

.date-divider::before,
.date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-soft), transparent);
}

/* ── Message row ── */
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  animation: msgIn 0.35s var(--spring);
  margin-bottom: 4px;
  position: relative;
}

.msg-row.mine {
  flex-direction: row-reverse;
}

@keyframes msgIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 12px;
  color: #fff;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  align-self: flex-end;
  margin-bottom: 2px;
}

.msg-avatar.anil { background: linear-gradient(135deg, #ec4899, #f43f5e); }
.msg-avatar.elshan { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
.msg-avatar.system { background: linear-gradient(135deg, #64748b, #475569); }

.msg-bubble-wrap {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-width: min(78%, 480px);
  min-width: 0;
}

.msg-row.mine .msg-bubble-wrap {
  align-items: flex-start;
}

.msg-sender {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-2);
  padding: 0 8px;
  margin-bottom: 2px;
}

.msg-row.mine .msg-sender { display: none; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.6;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  position: relative;
  transition: transform 0.15s var(--ease);
  box-shadow: var(--shadow-sm);
}

.msg-row:not(.mine) .msg-bubble {
  background: var(--bubble-other);
  border: 1px solid var(--border-soft);
  border-bottom-right-radius: 6px;
  color: var(--text);
}

.msg-row.mine .msg-bubble {
  background: var(--bubble-me);
  color: #fff;
  border-bottom-left-radius: 6px;
  box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
}

.msg-row.mine .msg-bubble::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 50%);
  pointer-events: none;
}

/* ── File message ── */
.msg-bubble img,
.msg-bubble video {
  display: block;
  max-width: 100%;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.2s var(--ease);
}

.msg-bubble img:hover,
.msg-bubble video:hover {
  transform: scale(1.01);
}

.msg-bubble .file-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  opacity: 0.85;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.15);
}

/* ── Message meta (time + read) ── */
.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: var(--text-mute);
  padding: 0 8px;
  margin-top: 2px;
}

.msg-row.mine .msg-meta {
  flex-direction: row-reverse;
  justify-content: flex-start;
}

.msg-time {
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.3px;
}

.msg-tick {
  font-size: 12px;
  color: var(--text-mute);
  transition: color 0.3s var(--ease);
  display: inline-flex;
  align-items: center;
}

.msg-tick.read {
  color: var(--cyan);
  animation: tickPop 0.35s var(--spring);
}

@keyframes tickPop {
  0%   { transform: scale(0.6); }
  60%  { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* ── System message ── */
.msg-row.system {
  justify-content: center;
  margin: 8px 0;
}

.msg-row.system .msg-avatar { display: none; }

.msg-row.system .msg-bubble-wrap {
  max-width: 90%;
  align-items: center;
}

.msg-row.system .msg-bubble {
  background: transparent;
  border: 1px solid var(--border-soft);
  color: var(--text-mute);
  font-size: 11.5px;
  padding: 6px 14px;
  border-radius: 999px;
  box-shadow: none;
  font-weight: 500;
}

.msg-row.system .msg-bubble::after { display: none; }
.msg-row.system .msg-meta { display: none; }

/* ═════════════════════════════════════════════
   TYPING INDICATOR
   ═════════════════════════════════════════════ */
.typing-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 20px;
  font-size: 12px;
  color: var(--text-dim);
  min-height: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s var(--ease), padding 0.3s var(--ease);
}

.typing-bar.visible {
  max-height: 40px;
  padding: 6px 20px;
}

.typing-bubble {
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-3);
  padding: 8px 14px;
  border-radius: 18px;
  border: 1px solid var(--border-soft);
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-2);
  animation: typingBounce 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30%           { transform: translateY(-6px); opacity: 1; }
}

/* ═════════════════════════════════════════════
   INPUT BAR
   ═════════════════════════════════════════════ */
.input-bar {
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(0deg, rgba(13, 16, 25, 0.98), rgba(20, 24, 38, 0.9));
  border-top: 1px solid var(--border-soft);
  position: relative;
  flex-shrink: 0;
}

.input-bar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.4;
}

.input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 6px 6px 6px 8px;
  transition: all 0.2s var(--ease);
}

.input-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
  background: var(--bg-3);
}

.input-action {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 19px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.2s var(--ease);
  flex-shrink: 0;
}

.input-action:hover {
  background: var(--bg-4);
  color: var(--accent-2);
  transform: scale(1.08);
}

.input-action:active { transform: scale(0.92); }

#chat-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 14.5px;
  padding: 10px 4px;
  outline: none;
  resize: none;
  max-height: 120px;
  min-height: 20px;
  line-height: 1.5;
  scrollbar-width: none;
}

#chat-input::-webkit-scrollbar { display: none; }

#chat-input::placeholder {
  color: var(--text-mute);
  transition: opacity 0.2s;
}

.send-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--bubble-me);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.25s var(--spring);
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(139, 92, 246, 0.45);
  position: relative;
  overflow: hidden;
}

.send-btn::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--accent), var(--accent-3), var(--accent));
  opacity: 0;
  transition: opacity 0.3s;
  z-index: -1;
  animation: rotateConic 3s linear infinite;
}

@keyframes rotateConic {
  to { transform: rotate(360deg); }
}

.send-btn:not(:disabled):hover {
  transform: scale(1.08) rotate(-5deg);
  box-shadow: 0 6px 20px rgba(139, 92, 246, 0.65);
}

.send-btn:not(:disabled):active { transform: scale(0.94); }

.send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  background: var(--bg-4);
  box-shadow: none;
}

.send-btn svg {
  width: 20px;
  height: 20px;
  transform: scaleX(-1);
}

/* ═════════════════════════════════════════════
   FILE PREVIEW
   ═════════════════════════════════════════════ */
.file-preview {
  display: none;
  margin-bottom: 8px;
  padding: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  position: relative;
  animation: slideUp 0.3s var(--spring);
}

.file-preview.visible { display: flex; align-items: center; gap: 10px; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.file-preview-thumb {
  width: 52px;
  height: 52px;
  border-radius: 10px;
  object-fit: cover;
  background: var(--bg-4);
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 24px;
}

.file-preview-info {
  flex: 1;
  min-width: 0;
  font-size: 12px;
}

.file-preview-name {
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.file-preview-size {
  color: var(--text-mute);
  margin-top: 2px;
}

.file-preview-remove {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--bg-4);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  display: grid;
  place-items: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.file-preview-remove:hover {
  background: var(--red);
  color: #fff;
  transform: rotate(90deg);
}

/* ═════════════════════════════════════════════
   MODAL — NAME SELECTION
   ═════════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(7, 8, 15, 0.85);
  backdrop-filter: blur(12px);
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s var(--ease);
}

.modal-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 36px 28px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-lg), 0 0 60px var(--accent-glow);
  transform: scale(0.9) translateY(20px);
  transition: transform 0.4s var(--spring);
  position: relative;
  overflow: hidden;
}

.modal-overlay.visible .modal {
  transform: scale(1) translateY(0);
}

.modal::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, var(--accent-glow), transparent, var(--accent-3), transparent);
  animation: rotateConic 8s linear infinite;
  opacity: 0.15;
  z-index: 0;
}

.modal > * { position: relative; z-index: 1; }

.modal-icon {
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  border-radius: 22px;
  display: grid;
  place-items: center;
  font-size: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent-3));
  box-shadow: var(--shadow-glow);
  animation: float 3s ease-in-out infinite;
}

.modal-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 8px;
  background: linear-gradient(90deg, #fff, var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.modal-subtitle {
  color: var(--text-dim);
  font-size: 13.5px;
  margin-bottom: 26px;
  line-height: 1.7;
}

.name-options {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.name-btn {
  flex: 1;
  padding: 18px 12px;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  background: var(--bg-3);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s var(--spring);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}

.name-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.3s;
}

.name-btn.anil::before {
  background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(244, 63, 94, 0.1));
}

.name-btn.elshan::before {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.1));
}

.name-btn:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}

.name-btn.anil:hover {
  border-color: var(--accent-3);
  box-shadow: 0 8px 24px rgba(236, 72, 153, 0.35);
}

.name-btn.elshan:hover {
  border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
}

.name-btn:hover::before { opacity: 1; }
.name-btn > * { position: relative; z-index: 1; }

.name-emoji { font-size: 28px; }

.divider-text {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-mute);
  font-size: 11.5px;
  margin: 16px 0;
}

.divider-text::before,
.divider-text::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.custom-name-wrap {
  display: flex;
  gap: 8px;
}

#custom-name {
  flex: 1;
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 13px 16px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
  text-align: center;
}

#custom-name:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

#custom-name::placeholder { color: var(--text-mute); }

.confirm-btn {
  background: var(--bubble-me);
  color: #fff;
  border: none;
  padding: 13px 20px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s var(--spring);
  white-space: nowrap;
}

.confirm-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-glow); }
.confirm-btn:active { transform: scale(0.96); }

/* ═════════════════════════════════════════════
   TOAST
   ═════════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg-4);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-md);
  z-index: 2000;
  transition: transform 0.4s var(--spring), opacity 0.3s;
  max-width: 90vw;
  opacity: 0;
  pointer-events: none;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.toast.success { border-color: var(--green); color: #d1fae5; }
.toast.error { border-color: var(--red); color: #fee2e2; }

/* ═════════════════════════════════════════════
   IMAGE LIGHTBOX
   ═════════════════════════════════════════════ */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.95);
  z-index: 3000;
  display: none;
  place-items: center;
  padding: 40px;
  cursor: zoom-out;
  animation: fadeIn 0.2s;
}

.lightbox.visible { display: grid; }

.lightbox img,
.lightbox video {
  max-width: 100%;
  max-height: 100%;
  border-radius: 12px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8);
  animation: zoomIn 0.3s var(--spring);
}

@keyframes zoomIn {
  from { transform: scale(0.85); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* ═════════════════════════════════════════════
   SCROLL BUTTON
   ═════════════════════════════════════════════ */
.scroll-btn {
  position: absolute;
  bottom: 90px;
  left: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-3);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
  transition: all 0.3s var(--spring);
  z-index: 20;
}

.scroll-btn.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.scroll-btn:hover { background: var(--accent); color: #fff; }

/* ═════════════════════════════════════════════
   RESPONSIVE
   ═════════════════════════════════════════════ */
@media (max-width: 640px) {
  .app {
    border-left: none;
    border-right: none;
  }

  .header { padding: 12px 16px; }
  .header-title { font-size: 15px; }
  .messages { padding: 18px 12px 8px; }
  .msg-bubble-wrap { max-width: 82%; }
  .msg-bubble { font-size: 14px; padding: 9px 12px; }
  .msg-avatar { width: 28px; height: 28px; font-size: 11px; }
  .modal { padding: 28px 22px; }
  .modal-icon { width: 60px; height: 60px; font-size: 30px; }
  .modal-title { font-size: 19px; }
  .name-btn { padding: 14px 8px; font-size: 14px; }
  .name-emoji { font-size: 24px; }
}

@media (max-width: 400px) {
  .name-options { flex-direction: column; }
  .custom-name-wrap { flex-direction: column; }
}

/* ═════════════════════════════════════════════
   ACCESSIBILITY & REDUCED MOTION
   ═════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

<!-- ═══════════════ SCRIPTS ═══════════════ -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   Elshan & Anil Messenger — Client Logic
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  // ─── DOM refs ───
  const $ = (id) => document.getElementById(id);

  const messagesEl    = $('messages');
  const emptyEl       = $('empty-state');
  const headerStatus  = $('header-status');
  const statusDot     = $('status-dot');
  const statusText    = $('status-text');
  const typingBar     = $('typing-bar');
  const typingText    = $('typing-text');
  const chatInput     = $('chat-input');
  const sendBtn       = $('send-btn');
  const attachBtn     = $('attach-btn');
  const fileInput     = $('file-input');
  const filePreview   = $('file-preview');
  const fileThumb     = $('file-thumb');
  const fileName      = $('file-name');
  const fileSize      = $('file-size');
  const fileRemove    = $('file-remove');
  const nameModal     = $('name-modal');
  const customName    = $('custom-name');
  const confirmName   = $('confirm-name');
  const changeNameBtn = $('change-name-btn');
  const scrollBtn     = $('scroll-btn');
  const lightbox      = $('lightbox');
  const toastEl       = $('toast');

  // ─── State ───
  let username    = sessionStorage.getItem('messenger_username') || '';
  let socket      = null;
  let pendingFile = null;   // { file, dataUrl, type }
  let typingTimer = null;
  let isTyping    = false;
  let isAtBottom  = true;
  let renderedIds = new Set();

  // ─── Utils ───
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function fmtTime(iso) {
    try {
      const d = iso ? new Date(iso) : new Date();
      return d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    } catch {
      return '';
    }
  }

  function fmtDate(iso) {
    try {
      const d = iso ? new Date(iso) : new Date();
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);

      const sameDay = (a, b) =>
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();

      if (sameDay(d, today)) return 'امروز';
      if (sameDay(d, yesterday)) return 'دیروز';
      return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch {
      return '';
    }
  }

  function fmtBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function toast(msg, type = '') {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + type;
    toastEl.classList.add('show');
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  function avatarClass(name) {
    if (name === 'آنیل') return 'anil';
    if (name === 'الشن') return 'elshan';
    return 'system';
  }

  function avatarLetter(name) {
    return name ? name.trim().charAt(0) : '?';
  }

  // ─── Scroll management ───
  function scrollToBottom(smooth = true) {
    messagesEl.scrollTo({
      top: messagesEl.scrollHeight,
      behavior: smooth ? 'smooth' : 'auto',
    });
  }

  function updateScrollBtn() {
    const nearBottom =
      messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
    isAtBottom = nearBottom;
    scrollBtn.classList.toggle('visible', !nearBottom);
  }

  messagesEl.addEventListener('scroll', updateScrollBtn);

  scrollBtn.addEventListener('click', () => {
    scrollToBottom(true);
    scrollBtn.classList.remove('visible');
  });

  // ─── Name modal ───
  function openNameModal() {
    nameModal.classList.add('visible');
    setTimeout(() => customName.focus(), 350);
  }

  function closeNameModal() {
    nameModal.classList.remove('visible');
  }

  function setUsername(name) {
    name = (name || '').trim().slice(0, 20);
    if (!name) {
      toast('اسم نمی‌تونه خالی باشه', 'error');
      return;
    }
    username = name;
    sessionStorage.setItem('messenger_username', username);
    closeNameModal();

    if (socket && socket.connected) {
      socket.emit('join_chat', { username });
      toast(`خوش اومدی ${username}! 💜`, 'success');
    }
  }

  document.querySelectorAll('.name-btn').forEach((btn) => {
    btn.addEventListener('click', () => setUsername(btn.getAttribute('data-name')));
  });

  confirmName.addEventListener('click', () => setUsername(customName.value));

  customName.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      setUsername(customName.value);
    }
  });

  changeNameBtn.addEventListener('click', openNameModal);

  // ─── Socket.IO ───
  function connectSocket() {
    socket = io({ reconnection: true, reconnectionDelay: 1000 });

    socket.on('connect', () => {
      console.log('[socket] connected', socket.id);
      statusDot.classList.remove('offline');
      statusText.textContent = 'در حال اتصال به چت...';

      if (username) {
        socket.emit('join_chat', { username });
        closeNameModal();
      } else {
        openNameModal();
      }
    });

    socket.on('disconnect', (reason) => {
      console.log('[socket] disconnected', reason);
      statusDot.classList.add('offline');
      statusText.textContent = 'قطع شد — در حال اتصال مجدد...';
    });

    socket.on('connect_error', (err) => {
      console.log('[socket] connect_error', err.message);
      statusDot.classList.add('offline');
      statusText.textContent = 'خطای اتصال';
    });

    socket.on('rejected', (data) => {
      toast(data.reason || 'ظرفیت پر است', 'error');
      statusDot.classList.add('offline');
      statusText.textContent = data.reason || 'ظرفیت پر است';
    });

    socket.on('connected', (data) => {
      // تاریخچه
      if (Array.isArray(data.history)) {
        data.history.forEach(renderMessage);
      }
      if (Array.isArray(data.online_users)) {
        updateOnlineUsers(data.online_users);
      }
    });

    socket.on('joined', () => {
      if (username) toast(`خوش اومدی ${username}! 💜`, 'success');
    });

    socket.on('online_update', (data) => {
      updateOnlineUsers(data.users || []);
    });

    socket.on('chat_message', (msg) => {
      renderMessage(msg);
      // اگه پیام مال من نیست و صفحه بازه، mark_read بفرست
      if (msg.username !== username && msg.id && !msg.system) {
        socket.emit('mark_read', { id: msg.id });
      }
    });

    socket.on('typing_update', (data) => {
      const others = (data.typing || []).filter((n) => n !== username);
      if (others.length === 0) {
        typingBar.classList.remove('visible');
      } else {
        typingBar.classList.add('visible');
        typingText.textContent = others.length === 1
          ? `${others[0]} در حال نوشتن است...`
          : `${others.join('، ')} در حال نوشتن هستند...`;
      }
    });

    socket.on('message_read', (data) => {
      const el = document.querySelector(`[data-msg-id="${data.id}"] .msg-tick`);
      if (el) {
        el.classList.add('read');
        el.textContent = '✓✓';
      }
    });

    socket.on('chat_error', (data) => toast(data.message || 'خطا', 'error'));
  }

  // ─── Online users ───
  function updateOnlineUsers(users) {
    const online = users.filter(Boolean);
    if (online.length === 0) {
      statusText.textContent = 'هیچ‌کس آنلاین نیست';
      statusDot.classList.add('offline');
    } else {
      statusText.textContent = 'آنلاین: ' + online.join('، ');
      statusDot.classList.remove('offline');
    }
  }

  // ─── Render message ───
  function renderMessage(msg) {
    if (!msg) return;

    // جلوگیری از تکرار
    if (msg.id && renderedIds.has(msg.id)) return;
    if (msg.id) renderedIds.add(msg.id);

    // حذف empty state
    if (emptyEl && emptyEl.parentNode) emptyEl.remove();

    // date divider
    const lastDivider = messagesEl.querySelector('.date-divider:last-of-type');
    const lastDate = lastDivider ? lastDivider.getAttribute('data-date') : null;
    const msgDate = fmtDate(msg.timestamp);
    if (msgDate && msgDate !== lastDate) {
      const d = document.createElement('div');
      d.className = 'date-divider';
      d.setAttribute('data-date', msgDate);
      d.textContent = msgDate;
      messagesEl.appendChild(d);
    }

    // system message
    if (msg.system || msg.type === 'system') {
      const row = document.createElement('div');
      row.className = 'msg-row system';
      row.innerHTML = `
        <div class="msg-bubble-wrap">
          <div class="msg-bubble">${escapeHtml(msg.text || '')}</div>
        </div>
      `;
      messagesEl.appendChild(row);
      if (isAtBottom) scrollToBottom(true);
      return;
    }

    // normal message
    const mine = msg.username === username;
    const row = document.createElement('div');
    row.className = 'msg-row' + (mine ? ' mine' : '');
    if (msg.id) row.setAttribute('data-msg-id', msg.id);

    // avatar
    const av = document.createElement('div');
    av.className = 'msg-avatar ' + avatarClass(msg.username);
    av.textContent = avatarLetter(msg.username);
    row.appendChild(av);

    // bubble wrapper
    const wrap = document.createElement('div');
    wrap.className = 'msg-bubble-wrap';

    if (!mine) {
      const s = document.createElement('div');
      s.className = 'msg-sender';
      s.textContent = msg.username || 'ناشناس';
      wrap.appendChild(s);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (msg.type === 'image' && msg.content) {
      const img = document.createElement('img');
      img.src = msg.content;
      img.alt = 'عکس';
      img.loading = 'lazy';
      img.addEventListener('click', () => openLightbox(msg.content, 'image'));
      bubble.appendChild(img);
      if (msg.filename) {
        const info = document.createElement('div');
        info.className = 'file-info';
        info.textContent = '🖼 ' + msg.filename;
        bubble.appendChild(info);
      }
    } else if (msg.type === 'video' && msg.content) {
      const vid = document.createElement('video');
      vid.src = msg.content;
      vid.controls = true;
      vid.preload = 'metadata';
      bubble.appendChild(vid);
      if (msg.filename) {
        const info = document.createElement('div');
        info.className = 'file-info';
        info.textContent = '🎬 ' + msg.filename;
        bubble.appendChild(info);
      }
    } else {
      bubble.textContent = msg.content || '';
    }

    wrap.appendChild(bubble);

    // meta (time + tick)
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const t = document.createElement('span');
    t.className = 'msg-time';
    t.textContent = fmtTime(msg.timestamp);
    meta.appendChild(t);

    if (mine) {
      const tick = document.createElement('span');
      tick.className = 'msg-tick';
      const readBy = (msg.read_by || []).filter((n) => n !== username);
      if (readBy.length > 0) {
        tick.classList.add('read');
        tick.textContent = '✓✓';
      } else {
        tick.textContent = '✓';
      }
      meta.appendChild(tick);
    }

    wrap.appendChild(meta);
    row.appendChild(wrap);
    messagesEl.appendChild(row);

    if (isAtBottom) scrollToBottom(true);
  }

  // ─── Lightbox ───
  function openLightbox(src, type) {
    lightbox.innerHTML = '';
    if (type === 'video') {
      const v = document.createElement('video');
      v.src = src;
      v.controls = true;
      v.autoplay = true;
      lightbox.appendChild(v);
    } else {
      const i = document.createElement('img');
      i.src = src;
      lightbox.appendChild(i);
    }
    lightbox.classList.add('visible');
  }

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('visible');
    lightbox.innerHTML = '';
  });

  // ─── Input handling ───
  function autoResize() {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
  }

  function updateSendBtn() {
    const hasText = chatInput.value.trim().length > 0;
    const hasFile = !!pendingFile;
    sendBtn.disabled = !(hasText || hasFile);
  }

  chatInput.addEventListener('input', () => {
    autoResize();
    updateSendBtn();

    // typing
    if (!socket || !socket.connected) return;
    if (chatInput.value.trim().length > 0) {
      if (!isTyping) {
        isTyping = true;
        socket.emit('typing', { typing: true });
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        isTyping = false;
        socket.emit('typing', { typing: false });
      }, 1500);
    } else {
      if (isTyping) {
        isTyping = false;
        socket.emit('typing', { typing: false });
      }
      clearTimeout(typingTimer);
    }
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  // ─── File handling ───
  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;

    const isVideo = file.type.startsWith('video/');
    const isImage = file.type.startsWith('image/');
    if (!isVideo && !isImage) {
      toast('فقط عکس یا ویدیو مجاز است', 'error');
      fileInput.value = '';
      return;
    }

    const maxMB = isVideo ? 8 : 3;
    if (file.size > maxMB * 1024 * 1024) {
      toast(`حجم فایل باید کمتر از ${maxMB}MB باشد`, 'error');
      fileInput.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      pendingFile = {
        file,
        dataUrl: reader.result,
        type: isVideo ? 'video' : 'image',
      };

      // پیش‌نمایش
      filePreview.classList.add('visible');
      fileName.textContent = file.name;
      fileSize.textContent = fmtBytes(file.size);

      if (isImage) {
        const img = document.createElement('img');
        img.src = reader.result;
        img.className = 'file-preview-thumb';
        fileThumb.replaceWith(img);
        fileThumb = img;
        img.id = 'file-thumb';
      } else {
        fileThumb.innerHTML = '🎬';
      }

      updateSendBtn();
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  fileRemove.addEventListener('click', () => {
    pendingFile = null;
    filePreview.classList.remove('visible');
    const newThumb = document.createElement('div');
    newThumb.className = 'file-preview-thumb';
    newThumb.id = 'file-thumb';
    fileThumb.replaceWith(newThumb);
    fileThumb = newThumb;
    updateSendBtn();
  });

  // ─── Send ───
  function sendMessage() {
    if (!socket || !socket.connected) {
      toast('اتصال برقرار نیست', 'error');
      return;
    }

    const text = chatInput.value.trim();

    if (pendingFile) {
      socket.emit('chat_message', {
        type: pendingFile.type,
        content: pendingFile.dataUrl,
        filename: pendingFile.file.name,
        timestamp: new Date().toISOString(),
      });
      pendingFile = null;
      filePreview.classList.remove('visible');
      const newThumb = document.createElement('div');
      newThumb.className = 'file-preview-thumb';
      newThumb.id = 'file-thumb';
      fileThumb.replaceWith(newThumb);
      fileThumb = newThumb;
    } else if (text) {
      socket.emit('chat_message', {
        type: 'text',
        content: text,
        timestamp: new Date().toISOString(),
      });
    }

    chatInput.value = '';
    autoResize();
    updateSendBtn();
    chatInput.focus();

    // قطع typing
    if (isTyping && socket) {
      isTyping = false;
      socket.emit('typing', { typing: false });
    }
    clearTimeout(typingTimer);
  }

  sendBtn.addEventListener('click', sendMessage);

  // ─── Init ───
  connectSocket();
  autoResize();
  updateSendBtn();

  // اگه از قبل اسم داشتیم، مودال رو نبند تا اتصال برقرار بشه
  if (!username) openNameModal();

})();
</script>

</body>
</html>
