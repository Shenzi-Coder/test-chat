<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>آنیل و الشن —پیام‌رسان شخصی</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%238b5cf6'/><stop offset='1' stop-color='%23ec4899'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white'>💜</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════════
   RESET & DESIGN TOKENS
   ═══════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-0: #05060c;
  --bg-1: #0a0d17;
  --bg-2: #111522;
  --bg-3: #181d2e;
  --bg-4: #232941;
  --border: #2a3148;
  --border-soft: rgba(255, 255, 255, 0.055);

  --text: #f0f3ff;
  --text-dim: #a3abc6;
  --text-mute: #6a7392;

  --accent: #8b5cf6;
  --accent-2: #a78bfa;
  --accent-3: #ec4899;
  --accent-4: #f43f5e;
  --cyan: #22d3ee;
  --green: #10b981;
  --green-glow: rgba(16, 185, 129, 0.55);
  --red: #ef4444;

  --grad-me: linear-gradient(135deg, #8b5cf6 0%, #a855f7 40%, #ec4899 100%);
  --grad-anil: linear-gradient(135deg, #ec4899, #f43f5e);
  --grad-elshan: linear-gradient(135deg, #8b5cf6, #6366f1);
  --grad-brand: linear-gradient(120deg, #a78bfa, #ec4899, #22d3ee);

  --radius: 20px;
  --radius-lg: 28px;
  --radius-sm: 14px;
  --radius-xl: 36px;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 26px rgba(0, 0, 0, 0.42);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
  --glow: 0 0 32px rgba(139, 92, 246, 0.45);

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --expo: cubic-bezier(0.16, 1, 0.3, 1);
}

html, body {
  height: 100%;
  font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-0);
  color: var(--text);
  direction: rtl;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

::selection { background: rgba(139, 92, 246, 0.4); color: #fff; }

/* ═══════════════════════════════════════════════════════════════════
   BACKGROUND
   ═══════════════════════════════════════════════════════════════════ */
.bg-stage {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(139, 92, 246, 0.22), transparent 60%),
    radial-gradient(800px 450px at 10% 110%, rgba(236, 72, 153, 0.16), transparent 60%),
    radial-gradient(700px 400px at 50% 50%, rgba(34, 211, 238, 0.05), transparent 60%);
}

.bg-stage::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.7;
}

/* ═══════════════════════════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════════════════════════ */
.app {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 880px;
  margin: 0 auto;
  background: linear-gradient(180deg, rgba(10, 13, 23, 0.92), rgba(5, 6, 12, 0.98));
  border-left: 1px solid var(--border-soft);
  border-right: 1px solid var(--border-soft);
  overflow: hidden;
  box-shadow: 0 0 100px rgba(139, 92, 246, 0.08);
}

/* ═══════════════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════════════ */
.header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  background: linear-gradient(180deg, rgba(17, 21, 34, 0.98), rgba(10, 13, 23, 0.85));
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
  z-index: 20;
}

.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent-3), var(--cyan), transparent);
  background-size: 200% 100%;
  animation: shimmerLine 4s linear infinite;
  opacity: 0.75;
}

@keyframes shimmerLine {
  0%   { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

.avatars-stack {
  position: relative;
  width: 56px;
  height: 56px;
  flex-shrink: 0;
}

.avatar-ring {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--accent), var(--accent-3), var(--cyan), var(--accent));
  animation: spinSlow 6s linear infinite;
  opacity: 0.85;
}

@keyframes spinSlow { to { transform: rotate(360deg); } }

.avatar-ring-inner {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--bg-1);
}

.avatar-mini {
  position: absolute;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
  color: #fff;
  border: 2px solid var(--bg-1);
  box-shadow: var(--shadow-sm);
  transition: transform 0.35s var(--spring), z-index 0s;
  cursor: default;
}

.avatar-mini.anil { background: var(--grad-anil); top: 0; right: 0; z-index: 3; }
.avatar-mini.elshan { background: var(--grad-elshan); bottom: 0; left: 0; z-index: 2; }
.avatars-stack:hover .avatar-mini { transform: scale(1.12) rotate(-6deg); z-index: 10; }

.header-info { flex: 1; min-width: 0; }

.header-title {
  font-size: 16.5px;
  font-weight: 800;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 6px;
  line-height: 1.2;
}

.header-title .grad-text {
  background: var(--grad-brand);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientShift 5s ease infinite;
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

.heart-beat {
  font-size: 13px;
  -webkit-text-fill-color: initial;
  animation: heartbeat 1.6s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  25%      { transform: scale(1.25); }
  40%      { transform: scale(0.95); }
  60%      { transform: scale(1.2); }
}

.header-status {
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 4px;
  min-height: 16px;
  transition: color 0.3s;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 0 var(--green-glow);
  animation: pulseGreen 2s ease-in-out infinite;
  flex-shrink: 0;
  transition: background 0.3s;
}

@keyframes pulseGreen {
  0%   { box-shadow: 0 0 0 0 var(--green-glow); }
  70%  { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.status-dot.offline { background: var(--text-mute); animation: none; box-shadow: none; }

.header-actions { display: flex; gap: 8px; }

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--bg-2);
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.25s var(--ease);
  position: relative;
  overflow: hidden;
}

.icon-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--grad-me);
  opacity: 0;
  transition: opacity 0.25s;
}

.icon-btn > span { position: relative; z-index: 1; }

.icon-btn:hover {
  color: #fff;
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--glow);
}

.icon-btn:hover::before { opacity: 0.18; }
.icon-btn:active { transform: scale(0.94); }

/* ═══════════════════════════════════════════════════════════════════
   MESSAGES AREA
   ═══════════════════════════════════════════════════════════════════ */
.messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 26px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  position: relative;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-4) transparent;
  -webkit-overflow-scrolling: touch;
}

.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 20px; }
.messages::-webkit-scrollbar-thumb:hover { background: var(--accent); }

.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-mute);
  font-size: 14px;
  line-height: 2;
  padding: 40px 20px;
  animation: fadeIn 0.7s var(--expo);
}

.empty-orb {
  width: 110px;
  height: 110px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(167, 139, 250, 0.5), rgba(236, 72, 153, 0.3) 60%, transparent 80%);
  display: grid;
  place-items: center;
  font-size: 52px;
  position: relative;
  animation: floatOrb 4s ease-in-out infinite;
  box-shadow: 0 0 60px rgba(139, 92, 246, 0.35), inset 0 0 40px rgba(167, 139, 250, 0.15);
}

@keyframes floatOrb {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-14px) rotate(6deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.empty-state .title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.date-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 20px 8px 14px;
  color: var(--text-mute);
  font-size: 11px;
  font-weight: 600;
  animation: fadeIn 0.4s var(--ease);
}

.date-divider::before,
.date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-soft), transparent);
}

.date-divider span {
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(24, 29, 46, 0.6);
  border: 1px solid var(--border-soft);
}

.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 4px;
  position: relative;
  animation: msgIn 0.4s var(--spring);
  transform-origin: bottom;
}

.msg-row.mine { flex-direction: row-reverse; }

@keyframes msgIn {
  0%   { opacity: 0; transform: translateY(14px) scale(0.9); }
  70%  { opacity: 1; transform: translateY(-2px) scale(1.01); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 12.5px;
  color: #fff;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  align-self: flex-end;
  margin-bottom: 22px;
  position: relative;
  transition: transform 0.2s var(--spring);
}

.msg-row:hover .msg-avatar { transform: scale(1.08); }

.msg-avatar.anil { background: var(--grad-anil); box-shadow: 0 4px 14px rgba(236, 72, 153, 0.4); }
.msg-avatar.elshan { background: var(--grad-elshan); box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4); }
.msg-avatar.system { background: linear-gradient(135deg, #64748b, #475569); }

.msg-bubble-wrap {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-width: min(78%, 480px);
  min-width: 0;
}

.msg-row.mine .msg-bubble-wrap { align-items: flex-start; }

.msg-sender {
  font-size: 11px;
  font-weight: 700;
  padding: 0 10px;
  margin-bottom: 1px;
  letter-spacing: 0.2px;
}

.msg-row:not(.mine) .msg-sender.anil { color: #f472b6; }
.msg-row:not(.mine) .msg-sender.elshan { color: var(--accent-2); }
.msg-row:not(.mine) .msg-sender.other { color: var(--cyan); }
.msg-row.mine .msg-sender { display: none; }

.msg-bubble {
  padding: 11px 15px;
  border-radius: 20px;
  font-size: 14.5px;
  line-height: 1.65;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  position: relative;
  transition: transform 0.18s var(--ease);
  box-shadow: var(--shadow-sm);
  isolation: isolate;
}

.msg-row:not(.mine) .msg-bubble {
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  border: 1px solid var(--border-soft);
  border-bottom-right-radius: 6px;
  color: var(--text);
}

.msg-row.mine .msg-bubble {
  background: var(--grad-me);
  color: #fff;
  border-bottom-left-radius: 6px;
  box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.msg-row.mine .msg-bubble::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 45%);
  pointer-events: none;
  z-index: -1;
}

.msg-row:hover .msg-bubble { transform: translateY(-1px); }

.msg-bubble img,
.msg-bubble video {
  display: block;
  max-width: 100%;
  border-radius: 14px;
  cursor: zoom-in;
  transition: transform 0.25s var(--ease), filter 0.25s;
}

.msg-bubble img:hover,
.msg-bubble video:hover {
  transform: scale(1.015);
  filter: brightness(1.08);
}

/* ── Audio message ── */
.msg-bubble audio {
  display: block;
  width: 280px;
  max-width: 100%;
  border-radius: 14px;
  outline: none;
  margin: 2px 0;
}

.audio-caption {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  opacity: 0.85;
  margin-top: 6px;
  font-weight: 500;
}

.msg-bubble .file-caption {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  opacity: 0.85;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
  font-weight: 500;
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: var(--text-mute);
  padding: 0 10px;
  margin-top: 1px;
}

.msg-row.mine .msg-meta {
  flex-direction: row-reverse;
  justify-content: flex-start;
}

.msg-time {
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.4px;
  font-weight: 500;
}

.msg-tick {
  font-size: 12px;
  color: var(--text-mute);
  transition: color 0.35s var(--ease);
  display: inline-flex;
  align-items: center;
  font-weight: 700;
  letter-spacing: -1px;
}

.msg-tick.read {
  color: var(--cyan);
  text-shadow: 0 0 10px rgba(34, 211, 238, 0.6);
  animation: tickPop 0.4s var(--spring);
}

@keyframes tickPop {
  0%   { transform: scale(0.5) rotate(-15deg); }
  60%  { transform: scale(1.25) rotate(5deg); }
  100% { transform: scale(1) rotate(0); }
}

.msg-row.system {
  justify-content: center;
  margin: 10px 0;
}

.msg-row.system .msg-avatar { display: none; }

.msg-row.system .msg-bubble-wrap {
  max-width: 88%;
  align-items: center;
}

.msg-row.system .msg-bubble {
  background: rgba(24, 29, 46, 0.55);
  border: 1px solid var(--border-soft);
  color: var(--text-mute);
  font-size: 11.5px;
  padding: 7px 16px;
  border-radius: 999px;
  box-shadow: none;
  font-weight: 500;
}

.msg-row.system .msg-bubble::before { display: none; }
.msg-row.system .msg-meta { display: none; }

/* ═══════════════════════════════════════════════════════════════════
   TYPING INDICATOR
   ═══════════════════════════════════════════════════════════════════ */
.typing-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 22px;
  font-size: 12px;
  color: var(--text-dim);
  min-height: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s var(--expo), padding 0.35s var(--expo);
}

.typing-bar.visible {
  max-height: 44px;
  padding: 6px 22px 8px;
}

.typing-bubble {
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-3);
  padding: 9px 14px;
  border-radius: 18px;
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow-sm);
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-2);
  animation: typingBounce 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.18s; background: var(--accent-3); }
.typing-dot:nth-child(3) { animation-delay: 0.36s; background: var(--cyan); }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
  30%           { transform: translateY(-6px); opacity: 1; }
}

#typing-text {
  font-weight: 500;
  font-size: 11.5px;
  animation: fadeIn 0.3s var(--ease);
}

/* ═══════════════════════════════════════════════════════════════════
   INPUT BAR
   ═══════════════════════════════════════════════════════════════════ */
.input-bar {
  padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(0deg, rgba(5, 6, 12, 0.98), rgba(10, 13, 23, 0.85));
  border-top: 1px solid var(--border-soft);
  position: relative;
  flex-shrink: 0;
}

.input-bar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent-3), transparent);
  opacity: 0.5;
}

.input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 26px;
  padding: 5px 6px 5px 8px;
  transition: all 0.25s var(--ease);
  position: relative;
}

.input-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18), 0 0 30px rgba(139, 92, 246, 0.15);
  background: var(--bg-3);
}

.input-action {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 19px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.22s var(--spring);
  flex-shrink: 0;
}

.input-action:hover {
  background: var(--bg-4);
  color: var(--accent-2);
  transform: scale(1.1) rotate(8deg);
}

.input-action:active { transform: scale(0.9); }

#mic-btn.recording {
  color: var(--red);
  background: rgba(239, 68, 68, 0.15);
  animation: micPulse 1s ease-in-out infinite;
}

@keyframes micPulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.12); }
}

#chat-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 14.5px;
  padding: 11px 4px;
  outline: none;
  resize: none;
  max-height: 130px;
  min-height: 22px;
  line-height: 1.55;
  scrollbar-width: none;
}

#chat-input::-webkit-scrollbar { display: none; }
#chat-input::placeholder { color: var(--text-mute); }

.send-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: none;
  background: var(--grad-me);
  color: #fff;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.3s var(--spring);
  flex-shrink: 0;
  box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  position: relative;
  overflow: hidden;
}

.send-btn:not(:disabled):hover {
  transform: scale(1.1) rotate(-8deg);
  box-shadow: 0 8px 28px rgba(139, 92, 246, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

.send-btn:not(:disabled):active { transform: scale(0.92); }

.send-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  background: var(--bg-4);
  box-shadow: none;
}

.send-btn svg {
  width: 20px;
  height: 20px;
  transform: scaleX(-1);
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
}

/* ═══════════════════════════════════════════════════════════════════
   FILE PREVIEW
   ═══════════════════════════════════════════════════════════════════ */
.file-preview {
  display: none;
  margin-bottom: 8px;
  padding: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  position: relative;
  align-items: center;
  gap: 12px;
  animation: slideUp 0.35s var(--spring);
}

.file-preview.visible { display: flex; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.file-preview-thumb {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  object-fit: cover;
  background: var(--bg-4);
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 26px;
  overflow: hidden;
}

.file-preview-info {
  flex: 1;
  min-width: 0;
  font-size: 12px;
}

.file-preview-name {
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}

.file-preview-size {
  color: var(--text-mute);
  font-size: 11px;
}

.file-preview-remove {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--bg-4);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  display: grid;
  place-items: center;
  transition: all 0.25s var(--spring);
  flex-shrink: 0;
}

.file-preview-remove:hover {
  background: var(--red);
  color: #fff;
  transform: rotate(90deg) scale(1.08);
}

/* ═══════════════════════════════════════════════════════════════════
   RECORDING BAR
   ═══════════════════════════════════════════════════════════════════ */
.recording-bar {
  display: none;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  padding: 10px 14px;
  background: var(--bg-2);
  border: 1px solid var(--red);
  border-radius: 16px;
  animation: slideUp 0.35s var(--spring);
}

.recording-bar.visible { display: flex; }

.rec-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--red);
  animation: recPulse 1s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes recPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.8); }
}

.rec-time {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--red);
  font-size: 13px;
  min-width: 48px;
  text-align: center;
}

.rec-hint {
  flex: 1;
  font-size: 11.5px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rec-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  font-size: 15px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.2s var(--spring);
  flex-shrink: 0;
}

.rec-btn.stop   { background: var(--green); color: #fff; }
.rec-btn.cancel { background: var(--bg-4); color: var(--text-dim); }
.rec-btn:hover  { transform: scale(1.1); }
.rec-btn.cancel:hover { background: var(--red); color: #fff; }
