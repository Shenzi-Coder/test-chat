<!-- ═══════════════ SCRIPTS ═══════════════ -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);

  const messagesEl    = $('messages');
  const emptyEl       = $('empty-state');
  const statusDot     = $('status-dot');
  const statusText    = $('status-text');
  const typingBar     = $('typing-bar');
  const typingText    = $('typing-text');
  const chatInput     = $('chat-input');
  const sendBtn       = $('send-btn');
  const attachBtn     = $('attach-btn');
  const micBtn        = $('mic-btn');
  const fileInput     = $('file-input');
  const filePreview   = $('file-preview');
  const fileThumb     = $('file-thumb');
  const fileName      = $('file-name');
  const fileSize      = $('file-size');
  const fileRemove    = $('file-remove');
  const nameModal     = $('name-modal');
  const customName    = $('custom-name');
  const confirmName   = $('confirm-name');
  const changeNameBtn = $('change-name-btn');
  const profileBtn    = $('profile-btn');
  const scrollBtn     = $('scroll-btn');
  const lightbox      = $('lightbox');
  const lightboxClose = $('lightbox-close');
  const toastEl       = $('toast');
  const recordingBar  = $('recording-bar');
  const recTimeEl     = $('rec-time');
  const recStopBtn    = $('rec-stop');
  const recCancelBtn  = $('rec-cancel');

  /* Call elements */
  const callBtn         = $('call-btn');
  const videoBtn        = $('video-btn');
  const callModal       = $('call-modal');
  const callAvatar      = $('call-avatar');
  const callName        = $('call-name');
  const callStatus      = $('call-status');
  const callActions     = $('call-actions');
  const callModeBadge   = $('call-mode-badge-wrap');
  const callActive      = $('call-active');
  const activeName      = $('active-name');
  const activeTimer     = $('active-timer');
  const activeMuteBtn   = $('active-mute-btn');
  const activeEndBtn    = $('active-end-btn');
  const activeVideoBtn  = $('active-video-btn');
  const activeModeIcon  = $('active-mode-icon');
  const activeModeLabel = $('active-mode-label');
  const remoteVideoWrap = $('remote-video-wrap');
  const remoteVideo     = $('remote-video');
  const remoteAudio     = $('remote-audio');
  const remotePlaceholderAvatar = $('remote-placeholder-avatar');
  const remotePlaceholderName   = $('remote-placeholder-name');
  const remotePlaceholderHint   = $('remote-placeholder-hint');
  const localVideoWrap  = $('local-video-wrap');
  const localVideo      = $('local-video');

  let username    = sessionStorage.getItem('messenger_username') || '';
  let profileId   = sessionStorage.getItem('messenger_profile') || '';
  let socket      = null;
  let pendingFile = null;
  let typingTimer = null;
  let isTyping    = false;
  let isAtBottom  = true;
  const renderedIds = new Set();

  /* Voice recording */
  let mediaRecorder = null;
  let recChunks     = [];
  let recStream     = null;
  let recTimer      = null;
  let recSeconds    = 0;
  const MAX_REC_SECONDS = 60;

  /* Profiles */
  let profiles = {};
  let onlineUsers = [];

  /* WebRTC */
  let pc                = null;
  let localStream       = null;       // صدای من (و دوربین اگر دارم)
  let hasLocalVideo     = false;      // آیا دوربین دارم؟
  let videoSender       = null;       // RTCRtpSender ویدیو
  let remoteSid         = null;
  let callState         = 'idle';     // idle | outgoing | incoming | active
  let callMode          = 'audio';    // audio | video — نوع تماس درخواستی
  let incomingFrom      = null;       // { from_sid, from_name, mode }
  let callTimer         = null;
  let callSeconds       = 0;
  let iceServers        = [{ urls: 'stun:stun.l.google.com:19302' }];
  let pendingCandidates = [];
  let isMuted           = false;
  let isCamOff          = false;

  /* ═══════════ UTILS ═══════════ */
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function fmtTime(iso) {
    try {
      const d = iso ? new Date(iso) : new Date();
      return d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    } catch { return ''; }
  }

  function fmtDate(iso) {
    try {
      const d = iso ? new Date(iso) : new Date();
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      const sameDay = (a, b) =>
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
      if (sameDay(d, today)) return 'امروز';
      if (sameDay(d, yesterday)) return 'دیروز';
      return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch { return ''; }
  }

  function fmtBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function fmtRecTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function fmtCallTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function toast(msg, type = '') {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + type;
    toastEl.classList.add('show');
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  function avatarClass(name) {
    if (name === 'Kawaii Ghost' || name === 'آنیل') return 'anil';
    if (name === 'GHOSTFACE' || name === 'الشن') return 'elshan';
    return 'other';
  }

  function avatarLetter(name) {
    return name ? name.trim().charAt(0) : '?';
  }

  function makeAvatarElement(name, avatarUrl, extraClass) {
    const el = document.createElement('div');
    el.className = 'msg-avatar ' + (extraClass || avatarClass(name));
    if (avatarUrl) {
      const img = document.createElement('img');
      img.src = avatarUrl;
      img.alt = name || '';
      img.loading = 'lazy';
      el.appendChild(img);
    } else {
      el.textContent = avatarLetter(name);
    }
    return el;
  }

  function getProfileAvatar(name) {
    for (const uid in profiles) {
      if (profiles[uid].name === name) return profiles[uid].avatar;
    }
    return null;
  }

  /* ═══════════ SCROLL ═══════════ */
  function scrollToBottom(smooth = true) {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }

  function updateScrollBtn() {
    const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
    isAtBottom = nearBottom;
    scrollBtn.classList.toggle('visible', !nearBottom);
  }

  messagesEl.addEventListener('scroll', updateScrollBtn);
  scrollBtn.addEventListener('click', () => scrollToBottom(true));

  /* ═══════════ NAME MODAL ═══════════ */
  function openNameModal() {
    nameModal.classList.add('visible');
    setTimeout(() => customName.focus(), 400);
  }

  function closeNameModal() {
    nameModal.classList.remove('visible');
  }

  function setUsername(name, pid) {
    name = (name || '').trim().slice(0, 20);
    if (!name) { toast('اسم نمی‌تونه خالی باشه', 'error'); return; }
    username = name;
    profileId = pid || '';
    sessionStorage.setItem('messenger_username', username);
    if (profileId) sessionStorage.setItem('messenger_profile', profileId);
    else sessionStorage.removeItem('messenger_profile');
    closeNameModal();
    if (socket && socket.connected) {
      socket.emit('join_chat', { username, profile_id: profileId || null });
      toast(`خوش اومدی ${username}! 💜`, 'success');
    }
  }

  document.querySelectorAll('.name-btn').forEach((btn) => {
    btn.addEventListener('click', () =>
      setUsername(btn.getAttribute('data-name'), btn.getAttribute('data-profile'))
    );
  });

  confirmName.addEventListener('click', () => setUsername(customName.value, ''));
  customName.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); setUsername(customName.value, ''); }
  });
  changeNameBtn.addEventListener('click', openNameModal);

  profileBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (profileId) window.location.href = '/profile/' + profileId;
    else window.location.href = '/login';
  });

  /* ═══════════ FETCH ICE SERVERS ═══════════ */
  fetch('/api/ice')
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      if (data && Array.isArray(data.iceServers) && data.iceServers.length) {
        iceServers = data.iceServers;
      }
    })
    .catch(() => {});

  /* ═══════════ SOCKET.IO ═══════════ */
  function connectSocket() {
    socket = io({ reconnection: true, reconnectionDelay: 1000 });

    socket.on('connect', () => {
      statusDot.classList.remove('offline');
      statusText.textContent = 'در حال اتصال به چت...';
      if (username) {
        socket.emit('join_chat', { username, profile_id: profileId || null });
        closeNameModal();
      } else {
        openNameModal();
      }
    });

    socket.on('disconnect', () => {
      statusDot.classList.add('offline');
      statusText.textContent = 'قطع شد — در حال اتصال مجدد...';
      if (callState === 'active' || callState === 'outgoing') {
        cleanupCall(true);
      }
    });

    socket.on('connect_error', () => {
      statusDot.classList.add('offline');
      statusText.textContent = 'خطای اتصال';
    });

    socket.on('rejected', (data) => {
      toast(data.reason || 'ظرفیت پر است', 'error');
      statusDot.classList.add('offline');
      statusText.textContent = data.reason || 'ظرفیت پر است';
    });

    socket.on('connected', (data) => {
      if (data.profiles) profiles = data.profiles;
      if (Array.isArray(data.history)) data.history.forEach(renderMessage);
      if (Array.isArray(data.online_users)) {
        onlineUsers = data.online_users;
        updateOnlineUsers(data.online_users);
      }
    });

    socket.on('joined', () => {
      if (username) toast(`خوش اومدی ${username}! 💜`, 'success');
    });

    socket.on('online_update', (data) => {
      onlineUsers = data.users || [];
      updateOnlineUsers(onlineUsers);
    });

    socket.on('chat_message', (msg) => {
      renderMessage(msg);
      if (msg.username !== username && msg.id && !msg.system) {
        socket.emit('mark_read', { id: msg.id });
      }
    });

    socket.on('typing_update', (data) => {
      const others = (data.typing || []).filter((n) => n !== username);
      if (others.length === 0) {
        typingBar.classList.remove('visible');
      } else {
        typingBar.classList.add('visible');
        typingText.textContent = others.length === 1
          ? `${others[0]} در حال نوشتن است...`
          : `${others.join('، ')} در حال نوشتن هستند...`;
      }
    });

    socket.on('message_read', (data) => {
      const el = document.querySelector(`[data-msg-id="${data.id}"] .msg-tick`);
      if (el) { el.classList.add('read'); el.textContent = '✓✓'; }
    });

    socket.on('chat_error', (data) => toast(data.message || 'خطا', 'error'));

    /* ── Call events ── */
    socket.on('incoming_call', (data) => {
      if (callState !== 'idle') {
        socket.emit('call_reject', { to_sid: data.from_sid });
        return;
      }
      showIncomingCall(data);
    });

    socket.on('call_accepted', (data) => {
      if (callState !== 'outgoing') return;
      remoteSid = data.by_sid;
      callState = 'active';

      // ذخیره‌ی حالت واقعی: caller_mode و callee_mode
      const callerMode = data.caller_mode || 'audio';
      const calleeMode = data.callee_mode || 'audio';

      hideCallModal();
      showActiveCall(data.by_name || '—', callMode);
      startCallTimer();

      // ساخت offer با توجه به اینکه من دوربین دارم یا نه
      // (callMode = video → تلاش برای گرفتن دوربین)
      createOffer(callMode === 'video').catch((err) => {
        console.error('createOffer', err);
        toast('خطا در شروع تماس', 'error');
        cleanupCall(true);
      });
    });

    socket.on('call_rejected', () => {
      if (callState === 'outgoing') {
        toast('تماس رد شد', 'error');
        cleanupCall(false);
      }
    });

    socket.on('call_ended', () => {
      if (callState === 'active' || callState === 'outgoing') {
        toast('تماس قطع شد');
        cleanupCall(false);
      }
    });

    socket.on('call_error', (data) => {
      toast(data.message || 'خطا در تماس', 'error');
    });

    socket.on('webrtc_offer', async (data) => {
      if (!pc || callState !== 'active') return;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        await flushPendingCandidates();
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit('webrtc_answer', {
          to_sid: data.from_sid,
          answer: pc.localDescription,
        });
      } catch (err) {
        console.error('offer handler', err);
      }
    });

    socket.on('webrtc_answer', async (data) => {
      if (!pc) return;
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        await flushPendingCandidates();
      } catch (err) {
        console.error('answer handler', err);
      }
    });

    socket.on('webrtc_ice', async (data) => {
      if (!pc) return;
      const candidate = new RTCIceCandidate(data.candidate);
      if (!pc.remoteDescription || !pc.remoteDescription.type) {
        pendingCandidates.push(candidate);
        return;
      }
      try {
        await pc.addIceCandidate(candidate);
      } catch (err) {
        console.warn('addIceCandidate', err);
      }
    });
  }

  function updateOnlineUsers(users) {
    const online = users.filter(Boolean);
    if (online.length === 0) {
      statusText.textContent = 'هیچ‌کس آنلاین نیست';
      statusDot.classList.add('offline');
    } else {
      statusText.textContent = 'آنلاین: ' + online.join('، ');
      statusDot.classList.remove('offline');
    }
  }

  /* ═══════════ RENDER MESSAGE ═══════════ */
  function renderMessage(msg) {
    if (!msg) return;
    if (msg.id && renderedIds.has(msg.id)) return;
    if (msg.id) renderedIds.add(msg.id);

    if (emptyEl && emptyEl.parentNode) emptyEl.remove();

    const lastDivider = messagesEl.querySelector('.date-divider:last-of-type');
    const lastDate = lastDivider ? lastDivider.getAttribute('data-date') : null;
    const msgDate = fmtDate(msg.timestamp);
    if (msgDate && msgDate !== lastDate) {
      const d = document.createElement('div');
      d.className = 'date-divider';
      d.setAttribute('data-date', msgDate);
      const s = document.createElement('span');
      s.textContent = msgDate;
      d.appendChild(s);
      messagesEl.appendChild(d);
    }

    if (msg.system || msg.type === 'system') {
      const row = document.createElement('div');
      row.className = 'msg-row system';
      row.innerHTML = `<div class="msg-bubble-wrap"><div class="msg-bubble">${escapeHtml(msg.text || '')}</div></div>`;
      messagesEl.appendChild(row);
      if (isAtBottom) scrollToBottom(true);
      return;
    }

    const mine = msg.username === username;
    const row = document.createElement('div');
    row.className = 'msg-row' + (mine ? ' mine' : '');
    if (msg.id) row.setAttribute('data-msg-id', msg.id);

    let avatarUrl = msg.avatar;
    if (!avatarUrl && msg.profile_id && profiles[msg.profile_id]) {
      avatarUrl = profiles[msg.profile_id].avatar;
    }

    const av = makeAvatarElement(msg.username, avatarUrl);
    row.appendChild(av);

    const wrap = document.createElement('div');
    wrap.className = 'msg-bubble-wrap';

    if (!mine) {
      const s = document.createElement('div');
      s.className = 'msg-sender ' + avatarClass(msg.username);
      s.textContent = msg.username || 'ناشناس';
      wrap.appendChild(s);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (msg.type === 'image' && msg.content) {
      const img = document.createElement('img');
      img.src = msg.content;
      img.alt = 'عکس';
      img.loading = 'lazy';
      img.addEventListener('click', () => openLightbox(msg.content, 'image'));
      bubble.appendChild(img);
      if (msg.filename) {
        const info = document.createElement('div');
        info.className = 'file-caption';
        info.textContent = '🖼 ' + msg.filename;
        bubble.appendChild(info);
      }
    } else if (msg.type === 'video' && msg.content) {
      const vid = document.createElement('video');
      vid.src = msg.content;
      vid.controls = true;
      vid.preload = 'metadata';
      bubble.appendChild(vid);
      if (msg.filename) {
        const info = document.createElement('div');
        info.className = 'file-caption';
        info.textContent = '🎬 ' + msg.filename;
        bubble.appendChild(info);
      }
    } else if (msg.type === 'audio' && msg.content) {
      const audio = document.createElement('audio');
      audio.src = msg.content;
      audio.controls = true;
      audio.preload = 'metadata';
      bubble.appendChild(audio);
      if (msg.filename) {
        const info = document.createElement('div');
        info.className = 'file-caption';
        info.textContent = '🎙 ' + msg.filename.replace(/^voice-/, 'ویس ');
        bubble.appendChild(info);
      }
    } else {
      bubble.textContent = msg.content || '';
    }

    wrap.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const t = document.createElement('span');
    t.className = 'msg-time';
    t.textContent = fmtTime(msg.timestamp);
    meta.appendChild(t);

    if (mine) {
      const tick = document.createElement('span');
      tick.className = 'msg-tick';
      const readBy = (msg.read_by || []).filter((n) => n !== username);
      if (readBy.length > 0) { tick.classList.add('read'); tick.textContent = '✓✓'; }
      else { tick.textContent = '✓'; }
      meta.appendChild(tick);
    }

    wrap.appendChild(meta);
    row.appendChild(wrap);
    messagesEl.appendChild(row);

    if (isAtBottom) scrollToBottom(true);
  }

  /* ═══════════ LIGHTBOX ═══════════ */
  function openLightbox(src, type) {
    const old = lightbox.querySelector('img, video');
    if (old) old.remove();
    if (type === 'video') {
      const v = document.createElement('video');
      v.src = src; v.controls = true; v.autoplay = true;
      lightbox.appendChild(v);
    } else {
      const i = document.createElement('img');
      i.src = src;
      lightbox.appendChild(i);
    }
    lightbox.classList.add('visible');
  }

  function closeLightbox() {
    lightbox.classList.remove('visible');
    const media = lightbox.querySelector('img, video');
    if (media) media.remove();
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  lightboxClose.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('visible')) closeLightbox();
  });

  /* ═══════════ INPUT ═══════════ */
  function autoResize() {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 130) + 'px';
  }

  function updateSendBtn() {
    const hasText = chatInput.value.trim().length > 0;
    const hasFile = !!pendingFile;
    sendBtn.disabled = !(hasText || hasFile);
  }

  chatInput.addEventListener('input', () => {
    autoResize();
    updateSendBtn();
    if (!socket || !socket.connected) return;
    if (chatInput.value.trim().length > 0) {
      if (!isTyping) {
        isTyping = true;
        socket.emit('typing', { typing: true });
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        isTyping = false;
        socket.emit('typing', { typing: false });
      }, 1500);
    } else {
      if (isTyping) {
        isTyping = false;
        socket.emit('typing', { typing: false });
      }
      clearTimeout(typingTimer);
    }
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  /* ═══════════ FILE ═══════════ */
  function resetFileThumb() {
    const oldThumb = document.getElementById('file-thumb');
    const newThumb = document.createElement('div');
    newThumb.className = 'file-preview-thumb';
    newThumb.id = 'file-thumb';
    oldThumb.replaceWith(newThumb);
  }

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const isVideo = file.type.startsWith('video/');
    const isImage = file.type.startsWith('image/');
    if (!isVideo && !isImage) {
      toast('فقط عکس یا ویدیو مجاز است', 'error');
      fileInput.value = '';
      return;
    }
    const maxMB = isVideo ? 8 : 3;
    if (file.size > maxMB * 1024 * 1024) {
      toast(`حجم فایل باید کمتر از ${maxMB}MB باشد`, 'error');
      fileInput.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      pendingFile = { file, dataUrl: reader.result, type: isVideo ? 'video' : 'image' };
      filePreview.classList.add('visible');
      fileName.textContent = file.name;
      fileSize.textContent = fmtBytes(file.size);

      const oldThumb = document.getElementById('file-thumb');
      if (isImage) {
        const img = document.createElement('img');
        img.src = reader.result;
        img.className = 'file-preview-thumb';
        img.id = 'file-thumb';
        oldThumb.replaceWith(img);
      } else {
        oldThumb.textContent = '🎬';
      }
      updateSendBtn();
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  fileRemove.addEventListener('click', () => {
    pendingFile = null;
    filePreview.classList.remove('visible');
    resetFileThumb();
    updateSendBtn();
  });

  /* ═══════════ VOICE RECORDING ═══════════ */
  function startRecordingUI() {
    recordingBar.classList.add('visible');
    micBtn.style.color = 'var(--red)';
    micBtn.textContent = '⏺';
    recSeconds = 0;
    recTimeEl.textContent = fmtRecTime(0);
    recTimer = setInterval(() => {
      recSeconds++;
      recTimeEl.textContent = fmtRecTime(recSeconds);
      if (recSeconds >= MAX_REC_SECONDS) stopRecording(true);
    }, 1000);
  }

  function cleanupRecording() {
    recordingBar.classList.remove('visible');
    micBtn.style.color = '';
    micBtn.textContent = '🎙️';
    clearInterval(recTimer);
    recTimer = null;
    if (recStream) {
      recStream.getTracks().forEach(t => t.stop());
      recStream = null;
    }
    mediaRecorder = null;
    recChunks = [];
  }

  async function startRecording() {
    if (!socket || !socket.connected) { toast('اتصال برقرار نیست', 'error'); return; }
    if (mediaRecorder && mediaRecorder.state === 'recording') return;
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      toast('مرورگر شما از ضبط صدا پشتیبانی نمی‌کند', 'error');
      return;
    }
    if (!window.isSecureContext) {
      toast('ضبط صدا فقط روی HTTPS یا localhost کار می‌کند', 'error');
      return;
    }
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      toast('دسترسی به میکروفون داده نشد', 'error');
      return;
    }

    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']
      .find(t => MediaRecorder.isTypeSupported(t)) || '';

    try {
      mediaRecorder = mime ? new MediaRecorder(recStream, { mimeType: mime })
                           : new MediaRecorder(recStream);
    } catch {
      toast('ضبط صدا در این مرورگر ممکن نیست', 'error');
      cleanupRecording();
      return;
    }

    recChunks = [];
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      const shouldSend = mediaRecorder.__shouldSend === true;
      const mimeType = mediaRecorder.mimeType || 'audio/webm';
      const blob = new Blob(recChunks, { type: mimeType });
      const duration = recSeconds;
      cleanupRecording();

      if (!shouldSend) return;
      if (blob.size < 500) { toast('ضبط خیلی کوتاه بود', 'error'); return; }
      if (blob.size > 8 * 1024 * 1024) {
        toast('ویس خیلی بزرگ است (حداکثر ۸MB)', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const ext = mimeType.includes('mp4') ? 'm4a'
                  : mimeType.includes('ogg') ? 'ogg' : 'webm';
        socket.emit('chat_message', {
          type: 'audio',
          content: reader.result,
          filename: `voice-${duration}s.${ext}`,
          timestamp: new Date().toISOString(),
        });
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start();
    startRecordingUI();
  }

  function stopRecording(send = true) {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    mediaRecorder.__shouldSend = send;
    mediaRecorder.stop();
  }

  micBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording(true);
    else startRecording();
  });
  recStopBtn.addEventListener('click', () => stopRecording(true));
  recCancelBtn.addEventListener('click', () => stopRecording(false));

  window.addEventListener('beforeunload', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      try { stopRecording(false); } catch {}
    }
    if (recStream) recStream.getTracks().forEach(t => t.stop());
    cleanupCall(true);
  });

  /* ═══════════ SEND ═══════════ */
  function sendMessage() {
    if (!socket || !socket.connected) {
      toast('اتصال برقرار نیست', 'error');
      return;
    }
    const text = chatInput.value.trim();

    if (pendingFile) {
      socket.emit('chat_message', {
        type: pendingFile.type,
        content: pendingFile.dataUrl,
        filename: pendingFile.file.name,
        timestamp: new Date().toISOString(),
      });
      pendingFile = null;
      filePreview.classList.remove('visible');
      resetFileThumb();
    } else if (text) {
      socket.emit('chat_message', {
        type: 'text',
        content: text,
        timestamp: new Date().toISOString(),
      });
    }

    chatInput.value = '';
    autoResize();
    updateSendBtn();
    chatInput.focus();

    if (isTyping && socket) {
      isTyping = false;
      socket.emit('typing', { typing: false });
    }
    clearTimeout(typingTimer);
  }

  sendBtn.addEventListener('click', sendMessage);

  /* ═══════════════════════════════════════════════════════════════════
     WEBRTC — AUDIO + VIDEO CALL
     ═══════════════════════════════════════════════════════════════════ */

  function buildCallActions(mode, direction) {
    callActions.innerHTML = '';
    if (direction === 'incoming') {
      const accept = document.createElement('button');
      accept.className = 'call-action-btn accept';
      accept.innerHTML = '📞<small>قبول</small>';
      accept.addEventListener('click', acceptIncomingCall);

      const reject = document.createElement('button');
      reject.className = 'call-action-btn reject';
      reject.innerHTML = '✕<small>رد</small>';
      reject.addEventListener('click', rejectIncomingCall);

      callActions.appendChild(accept);
      callActions.appendChild(reject);
    } else {
      const cancel = document.createElement('button');
      cancel.className = 'call-action-btn reject';
      cancel.innerHTML = '✕<small>لغو</small>';
      cancel.addEventListener('click', () => {
        socket.emit('call_end');
        cleanupCall(false);
        toast('تماس لغو شد');
      });
      callActions.appendChild(cancel);
    }
  }

  function renderModeBadge(mode) {
    callModeBadge.innerHTML = '';
    const b = document.createElement('div');
    b.className = 'call-mode-badge ' + (mode === 'audio' ? 'audio' : '');
    b.textContent = mode === 'video' ? '🎥 تماس تصویری' : '📞 تماس صوتی';
    callModeBadge.appendChild(b);
  }

  function showOutgoingCall(mode) {
    callModal.classList.add('visible');
    callMode = mode;
    callBtn.classList.toggle('ringing', mode === 'audio');
    videoBtn.classList.toggle('ringing', mode === 'video');

    const others = onlineUsers.filter((n) => n !== username);
    if (others.length === 0) {
      toast('کسی آنلاین نیست', 'error');
      callBtn.classList.remove('ringing');
      videoBtn.classList.remove('ringing');
      callModal.classList.remove('visible');
      return;
    }

    const otherName = others[0];
    const otherAvatar = getProfileAvatar(otherName);

    callName.textContent = otherName;
    callStatus.innerHTML = '<span class="pulse-dots">در حال زنگ زدن</span>';

    callAvatar.innerHTML = '';
    if (otherAvatar) {
      const img = document.createElement('img');
      img.src = otherAvatar;
      img.alt = otherName;
      callAvatar.appendChild(img);
    } else {
      callAvatar.textContent = avatarLetter(otherName);
    }

    renderModeBadge(mode);
    buildCallActions(mode, 'outgoing');
    socket.emit('call_request', { mode });
    callState = 'outgoing';
  }

  function showIncomingCall(data) {
    callState = 'incoming';
    incomingFrom = data;
    callMode = data.mode || 'audio';

    callModal.classList.add('visible');
    callBtn.classList.toggle('ringing', callMode === 'audio');
    videoBtn.classList.toggle('ringing', callMode === 'video');

    const avatar = getProfileAvatar(data.from_name);

    callName.textContent = data.from_name || 'ناشناس';
    callStatus.innerHTML = '<span class="pulse-dots">در حال تماس</span>';

    callAvatar.innerHTML = '';
    if (avatar) {
      const img = document.createElement('img');
      img.src = avatar;
      img.alt = data.from_name;
      callAvatar.appendChild(img);
    } else {
      callAvatar.textContent = avatarLetter(data.from_name);
    }

    renderModeBadge(callMode);
    buildCallActions(callMode, 'incoming');
  }

  /* ── گرفتن میکروفن (و دوربین اگر بخوایم و ممکن باشه) ── */
  async function getLocalMedia(wantVideo) {
    // مرحله ۱: تلاش برای صدا + ویدیو (اگر بخوایم)
    if (wantVideo) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
        });
        hasLocalVideo = stream.getVideoTracks().length > 0;
        return stream;
      } catch (err) {
        console.warn('getUserMedia با ویدیو ناموفق:', err);
        // ادامه به fallback
      }
    }

    // مرحله ۲: فقط صدا
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false,
    });
    hasLocalVideo = false;
    return stream;
  }

  async function acceptIncomingCall() {
    if (!incomingFrom) return;
    remoteSid = incomingFrom.from_sid;
    const fromName = incomingFrom.from_name;

    // آیا کاربر دوربین داره؟ اگر تماس تصویریه، تلاش می‌کنیم؛ وگرنه فقط صدا
    const wantVideo = callMode === 'video';

    try {
      localStream = await getLocalMedia(wantVideo);
    } catch (err) {
      toast('دسترسی به میکروفن داده نشد', 'error');
      socket.emit('call_reject', { to_sid: remoteSid });
      cleanupCall(false);
      return;
    }

    // به سرور بگو با چه حالتی قبول می‌کنم
    const myMode = hasLocalVideo ? 'video' : 'audio';
    socket.emit('call_accept', { to_sid: remoteSid, mode: myMode });

    createPeerConnection();
    localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

    callState = 'active';
    hideCallModal();
    showActiveCall(fromName, myMode);
    startCallTimer();

    // نمایش ویدیوی خودم
    if (hasLocalVideo) {
      localVideo.srcObject = localStream;
      localVideoWrap.classList.remove('video-off');
      activeVideoBtn.classList.remove('active');
    } else {
      localVideoWrap.classList.add('video-off');
    }

    // اگر از قبل video track دارم، sender رو ذخیره کن
    if (hasLocalVideo) {
      const vt = localStream.getVideoTracks()[0];
      if (vt) {
        // پیدا کردن sender
        const senders = pc.getSenders();
        videoSender = senders.find(s => s.track && s.track.kind === 'video') || null;
      }
    }
  }

  function rejectIncomingCall() {
    if (incomingFrom) {
      socket.emit('call_reject', { to_sid: incomingFrom.from_sid });
    }
    cleanupCall(false);
    toast('تماس رد شد');
  }

  function hideCallModal() {
    callModal.classList.remove('visible');
    callBtn.classList.remove('ringing');
    videoBtn.classList.remove('ringing');
  }

  function showActiveCall(name, mode) {
    callActive.classList.add('visible');

    activeModeIcon.textContent = mode === 'video' ? '🎥' : '📞';
    activeModeLabel.textContent = mode === 'video' ? 'تماس تصویری' : 'تماس صوتی';
    activeName.textContent = name || '—';

    // پلیس‌هولدر طرف مقابل
    const avatar = getProfileAvatar(name);
    remotePlaceholderAvatar.innerHTML = '';
    if (avatar) {
      const img = document.createElement('img');
      img.src = avatar;
      img.alt = name;
      remotePlaceholderAvatar.appendChild(img);
    } else {
      remotePlaceholderAvatar.textContent = avatarLetter(name);
    }
    remotePlaceholderName.textContent = name || '—';
    remotePlaceholderHint.textContent = mode === 'video' ? 'در انتظار تصویر...' : 'تماس صوتی';

    // وضعیت اولیه: ویدیو خاموش
    remoteVideoWrap.classList.add('video-off');

    // حالت دوربین خودم
    if (hasLocalVideo) {
      localVideoWrap.classList.remove('video-off');
      activeVideoBtn.classList.remove('active');
    } else {
      localVideoWrap.classList.add('video-off');
      // دکمه‌ی دوربین غیرفعال
      activeVideoBtn.disabled = true;
      activeVideoBtn.style.opacity = '0.4';
    }

    isMuted = false;
    activeMuteBtn.classList.remove('active');
    activeMuteBtn.textContent = '🎙️';

    isCamOff = !hasLocalVideo;
  }

  function startCallTimer() {
    callSeconds = 0;
    activeTimer.textContent = '00:00';
    clearInterval(callTimer);
    callTimer = setInterval(() => {
      callSeconds++;
      activeTimer.textContent = fmtCallTime(callSeconds);
    }, 1000);
  }

  function createPeerConnection() {
    if (pc) {
      try { pc.close(); } catch {}
      pc = null;
    }

    pc = new RTCPeerConnection({ iceServers });

    pc.onicecandidate = (e) => {
      if (e.candidate && remoteSid) {
        socket.emit('webrtc_ice', {
          to_sid: remoteSid,
          candidate: e.candidate,
        });
      }
    };

    pc.ontrack = (e) => {
      const [stream] = e.streams;
      if (!stream) return;
      if (e.track.kind === 'audio') {
        remoteAudio.srcObject = stream;
        remoteAudio.play().catch(() => {
          toast('برای شنیدن صدا، دوباره روی تماس کلیک کن', 'error');
        });
      } else if (e.track.kind === 'video') {
        remoteVideo.srcObject = stream;
        remoteVideo.play().catch(() => {});
        remoteVideoWrap.classList.remove('video-off');
        // وقتی track ویدیو از طرف مقابل رسید، پلیس‌هولدر مخفی می‌شه
      }
    };

    pc.onconnectionstatechange = () => {
      if (!pc) return;
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        toast('اتصال تماس ضعیف شد', 'error');
      }
    };

    return pc;
  }

  async function createOffer(wantVideo) {
    if (!localStream) {
      localStream = await getLocalMedia(wantVideo);
    }

    createPeerConnection();
    localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

    // ذخیره‌ی sender ویدیو (اگر دارم)
    if (hasLocalVideo) {
      const senders = pc.getSenders();
      videoSender = senders.find(s => s.track && s.track.kind === 'video') || null;

      // نمایش ویدیوی خودم
      localVideo.srcObject = localStream;
      localVideoWrap.classList.remove('video-off');
    } else {
      localVideoWrap.classList.add('video-off');
      if (activeVideoBtn) {
        activeVideoBtn.disabled = true;
        activeVideoBtn.style.opacity = '0.4';
      }
    }

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    socket.emit('webrtc_offer', {
      to_sid: remoteSid,
      offer: pc.localDescription,
    });
  }

  async function flushPendingCandidates() {
    if (!pc || !pc.remoteDescription) return;
    const list = pendingCandidates.splice(0);
    for (const c of list) {
      try { await pc.addIceCandidate(c); } catch {}
    }
  }

  function cleanupCall(notifyPeer) {
    if (notifyPeer && socket && (callState === 'active' || callState === 'outgoing')) {
      try { socket.emit('call_end'); } catch {}
    }

    if (pc) {
      try { pc.close(); } catch {}
      pc = null;
    }

    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }

    if (remoteVideo) remoteVideo.srcObject = null;
    if (remoteAudio) remoteAudio.srcObject = null;
    if (localVideo) localVideo.srcObject = null;

    remoteSid = null;
    incomingFrom = null;
    pendingCandidates = [];
    isMuted = false;
    isCamOff = false;
    hasLocalVideo = false;
    videoSender = null;
    callState = 'idle';
    callMode = 'audio';

    clearInterval(callTimer);
    callTimer = null;

    hideCallModal();
    callActive.classList.remove('visible');
    activeTimer.textContent = '00:00';

    remoteVideoWrap.classList.add('video-off');
    localVideoWrap.classList.add('video-off');
    activeVideoBtn.disabled = false;
    activeVideoBtn.style.opacity = '';
  }

  /* ── دکمه‌های هدر ── */
  callBtn.addEventListener('click', () => {
    if (callState !== 'idle') { toast('شما در حال حاضر در تماس هستید'); return; }
    if (!socket || !socket.connected) { toast('اتصال برقرار نیست', 'error'); return; }
    if (!window.isSecureContext) { toast('تماس فقط روی HTTPS یا localhost کار می‌کند', 'error'); return; }
    showOutgoingCall('audio');
  });

  videoBtn.addEventListener('click', () => {
    if (callState !== 'idle') { toast('شما در حال حاضر در تماس هستید'); return; }
    if (!socket || !socket.connected) { toast('اتصال برقرار نیست', 'error'); return; }
    if (!window.isSecureContext) { toast('تماس فقط روی HTTPS یا localhost کار می‌کند', 'error'); return; }
    showOutgoingCall('video');
  });

  /* ── Mute toggle ── */
  activeMuteBtn.addEventListener('click', () => {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach((t) => { t.enabled = !isMuted; });
    activeMuteBtn.classList.toggle('active', isMuted);
    activeMuteBtn.textContent = isMuted ? '🔇' : '🎙️';
  });

  /* ── Camera toggle ── */
  activeVideoBtn.addEventListener('click', async () => {
    if (!pc || !remoteSid) return;

    if (hasLocalVideo) {
      // خاموش کردن دوربین
      isCamOff = true;
      localStream.getVideoTracks().forEach(t => { t.enabled = false; });
      localVideoWrap.classList.add('video-off');
      activeVideoBtn.classList.add('active');
      // اگه sender داری، track رو غیرفعال کن (بهتره track رو null نکنیم)
      if (videoSender) {
        try { await videoSender.replaceTrack(null); } catch {}
      }
    } else {
      // تلاش برای روشن کردن دوربین
      try {
        const camStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
        });
        const newTrack = camStream.getVideoTracks()[0];
        if (!newTrack) throw new Error('no video track');

        localStream.addTrack(newTrack);
        hasLocalVideo = true;
        isCamOff = false;

        localVideo.srcObject = localStream;
        localVideoWrap.classList.remove('video-off');
        activeVideoBtn.classList.remove('active');

        if (videoSender) {
          await videoSender.replaceTrack(newTrack);
        } else {
          const sender = pc.addTrack(newTrack, localStream);
          videoSender = sender;
          // نیاز به renegotiation
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          socket.emit('webrtc_offer', {
            to_sid: remoteSid,
            offer: pc.localDescription,
          });
        }
      } catch (err) {
        console.warn('روشن کردن دوربین ناموفق:', err);
        toast('دوربین در دسترس نیست', 'error');
      }
    }
  });

  /* ── End call ── */
  activeEndBtn.addEventListener('click', () => {
    cleanupCall(true);
    toast('تماس قطع شد');
  });

  /* ═══════════ INIT ═══════════ */
  connectSocket();
  autoResize();
  updateSendBtn();
  if (!username) openNameModal();

})();
</script>
