<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060c" />
<title>بازی‌ها 🎮</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='68' font-size='56' text-anchor='middle'>🎮</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-0: #05060c;
    --bg-1: #0a0d17;
    --bg-2: #111522;
    --bg-3: #181d2e;
    --border: #2a3148;
    --text: #f0f3ff;
    --text-dim: #a3abc6;
    --text-mute: #6a7392;
    --accent: #8b5cf6;
    --accent-2: #a78bfa;
    --accent-3: #ec4899;
    --green: #10b981;
    --cyan: #22d3ee;
    --yellow: #f59e0b;
    --grad-brand: linear-gradient(120deg, #a78bfa, #ec4899, #22d3ee);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  html, body {
    min-height: 100dvh;
    font-family: 'Vazirmatn', -apple-system, sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(139, 92, 246, 0.22), transparent 60%),
      radial-gradient(800px 450px at 10% 110%, rgba(236, 72, 153, 0.16), transparent 60%),
      var(--bg-0);
    color: var(--text);
    direction: rtl;
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom, 0px));
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.7;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    animation: pageIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes pageIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Hero ── */
  .hero-orb {
    width: 92px;
    height: 92px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 44px;
    background: radial-gradient(circle at 30% 30%, rgba(167, 139, 250, 0.55), rgba(236, 72, 153, 0.3) 60%, transparent 82%);
    box-shadow: 0 0 60px rgba(139, 92, 246, 0.4), inset 0 0 40px rgba(167, 139, 250, 0.18);
    animation: floatOrb 4s ease-in-out infinite;
  }

  @keyframes floatOrb {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-12px) rotate(6deg); }
  }

  h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
    text-align: center;
    background: var(--grad-brand);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientShift 5s ease infinite;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .sub {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 36px;
    text-align: center;
  }

  /* ── Grid ── */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    margin-bottom: 28px;
  }

  /* ── Game Card ── */
  .game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 32px 22px 26px;
    background: linear-gradient(180deg, rgba(24, 29, 46, 0.95), rgba(17, 21, 34, 0.95));
    border: 2px solid var(--border);
    border-radius: 24px;
    text-decoration: none;
    color: inherit;
    transition: all 0.4s var(--spring);
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.42);
    cursor: pointer;
  }

  .game-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
  }

  .game-card.batman::before {
    background: radial-gradient(circle at center, rgba(245, 158, 11, 0.2), transparent 70%);
  }

  .game-card.joker::before {
    background: radial-gradient(circle at center, rgba(16, 185, 129, 0.2), transparent 70%);
  }

  .game-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 22px 55px rgba(0, 0, 0, 0.55);
  }

  .game-card.batman:hover {
    border-color: var(--yellow);
    box-shadow: 0 22px 55px rgba(245, 158, 11, 0.35);
  }

  .game-card.joker:hover {
    border-color: var(--green);
    box-shadow: 0 22px 55px rgba(16, 185, 129, 0.35);
  }

  .game-card:hover::before { opacity: 1; }
  .game-card > * { position: relative; z-index: 1; }

  /* ── Game emoji ── */
  .game-emoji {
    font-size: 64px;
    line-height: 1;
    transition: transform 0.4s var(--spring);
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.4));
  }

  .game-card:hover .game-emoji { transform: scale(1.15) rotate(-6deg); }

  /* ── Game name ── */
  .game-name {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.3px;
    text-align: center;
  }

  .game-desc {
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.6;
    min-height: 40px;
  }

  /* ── Badge ── */
  .game-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    padding: 4px 11px;
    border-radius: 999px;
    font-weight: 600;
    margin-top: 2px;
  }

  .game-badge.solo {
    background: rgba(139, 92, 246, 0.15);
    color: var(--accent-2);
    border: 1px solid rgba(139, 92, 246, 0.3);
  }

  /* ── Play button hint ── */
  .play-hint {
    font-size: 11.5px;
    color: var(--text-mute);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transform: translateY(4px);
    transition: all 0.3s var(--spring);
  }

  .game-card:hover .play-hint {
    opacity: 1;
    transform: translateY(0);
    color: var(--accent-2);
  }

  .game-card.batman:hover .play-hint { color: var(--yellow); }
  .game-card.joker:hover .play-hint { color: var(--green); }

  /* ── Footer ── */
  .footer-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 12.5px;
    color: var(--text-mute);
    flex-wrap: wrap;
  }

  .footer-links a {
    color: var(--text-mute);
    text-decoration: none;
    transition: color 0.25s;
  }

  .footer-links a:hover { color: var(--accent-2); }

  /* ── Back button ── */
  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 15px;
    background: rgba(24, 29, 46, 0.85);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
    transition: all 0.25s var(--spring);
  }

  .back-home:hover {
    background: var(--bg-3);
    color: var(--text);
    border-color: var(--accent);
    transform: translateX(3px);
  }

  @media (max-width: 560px) {
    h1 { font-size: 24px; }
    .hero-orb { width: 76px; height: 76px; font-size: 36px; margin-bottom: 18px; }
    .games-grid { grid-template-columns: 1fr; gap: 14px; }
    .game-card { padding: 26px 18px 22px; }
    .game-emoji { font-size: 54px; }
    .game-name { font-size: 17px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  :focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 3px;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="top-nav">
    <a href="/" class="back-home">
      <span>←</span>
      <span>بازگشت به چت</span>
    </a>
  </div>

  <div class="hero-orb">🎮</div>
  <h1>بازی‌ها</h1>
  <p class="sub">یه بازی انتخاب کن و وقتت رو خوش بگذرون</p>

  <div class="games-grid">

    <a href="/games/batman" class="game-card batman">
      <div class="game-emoji">🦇</div>
      <div class="game-name">Batman</div>
      <div class="game-desc">بتمن رو کنترل کن، از موانع بپر و تا جایی که می‌تونی پیش برو</div>
      <span class="game-badge solo">🎯 تک‌نفره</span>
      <span class="play-hint">
        <span>▶</span>
        <span>بازی کن</span>
      </span>
    </a>

    <a href="/games/joker" class="game-card joker">
      <div class="game-emoji">🃏</div>
      <div class="game-name">Joker</div>
      <div class="game-desc">با جوکر همراه شو و رکورد بتمن رو بشکن</div>
      <span class="game-badge solo">🎯 تک‌نفره</span>
      <span class="play-hint">
        <span>▶</span>
        <span>بازی کن</span>
      </span>
    </a>

  </div>

  <div class="footer-links">
    <a href="/">بازگشت به چت</a>
  </div>

</div>

</body>
</html>
